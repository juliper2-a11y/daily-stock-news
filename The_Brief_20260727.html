/*AS*/const ARTICLES = [{"id":"1","source":"Wall Street Journal","sourceName":"Wall Street Journal","sourceDate":"JUL 26, 2026","sourceUrl":"","category":"테크","tag":"산업 분석","title":"지출 우려 딛고 질주하는 Alphabet, 성장 여력 충분하다","titleEn":"WSJ, 2026-7-23, Google Has the Muscle to Overpower Spending Worries","deck":"Alphabet이 2분기 실적에서 24% 매출 성장과 cloud 부문 급성장을 기록했다. AI 지출 급증과 Gemini 3.5 Pro 출시 지연이라는 변수에도 장기 성장 전망은 여전히 밝다는 평가다.","lede":"Alphabet이 지난 1년간 주가 80% 급등을 기록하며 시가총액 기준 세계 3위 기업으로 올라섰다. 한때 독점 규제 리스크와 ChatGPT발 검색 잠식 우려에 짓눌렸던 이 회사는 이제 AI 분야의 유력 주자로 부상했다. 2분기 실적 발표에서는 매출 24% 성장과 cloud 부문의 폭발적 확장을 확인했으며, AI 설비투자 확대와 모델 출시 지연이라는 과제가 남아 있음에도 성장 모멘텀은 여전히 견고하다는 분석이 나온다.","body":["=== 1년 만의 반전: 규제 리스크에서 AI 선두 경쟁으로 ===","지난해 여름만 해도 Alphabet은 반독점 규제 조사에 시달리며 OpenAI의 ChatGPT가 검색 광고 시장 90% 이상의 점유율을 잠식할 수 있다는 우려를 받았다. 일부 애널리스트는 회사를 분할해야 더 높은 가치를 인정받을 수 있다고 주장하기도 했다.","1년이 지난 지금, 상황은 완전히 바뀌었다. 반독점 소송은 대부분 마무리 국면에 접어들었고, ChatGPT에 의한 검색 위협은 과장된 것으로 드러났다. Google은 검색 광고 매출이 전체 수익의 절반 이상을 차지하는 핵심 사업을 지켜내는 동시에, AI 분야에서도 선두권 경쟁자로 자리매김했다.","Alphabet의 주가는 지난 1년간 80% 이상 급등하며 Nvidia와 Apple에 이어 세계 시가총액 3위를 기록했다. 주가는 현재 선행 주가수익비율(PER) 약 25배 수준으로, 풍부한 밸류에이션이지만 회사의 성장 전망을 감안하면 과도한 수준은 아니라는 평가다.","=== 2분기 실적: 매출·cloud 모두 서프라이즈 ===","Alphabet은 7월 23일(현지시간) 발표한 2분기 실적에서 전년 동기 대비 24%의 매출 성장을 달성했다. 특히 cloud 부문 매출은 82% 증가한 248억 달러를 기록했으며, Apple, Meta, Anthropic 등 대형 고객이 포함된 5,140억 달러 규모의 수주 잔고(backlog)를 공개했다.","Google의 검색 사업 매출은 2분기에 17% 증가했다. BMO Capital Markets 애널리스트들은 AI 개요(AI Overviews) 기능이 검색 트래픽을 끌어올리면서 Google 검색 부문이 올해 남은 기간 내내 두 자릿수 분기 성장을 이어갈 것으로 전망했다.","__IMG__:data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCAOSBEMDASIAAhEBAxEB/8QAHAABAAIDAQEBAAAAAAAAAAAAAAMGBQcIBAIB/8QAYBAAAQMCAgQICQYKCAQEBAMJAAECAwQFBhESEyExBzZBUWOSsbIUIjVhcXJzdJEWMjM0gZQIFSM3VWahwcPiFyRCUmKzwtFTgoTSVFZ1kyUmQ2R2osQYRIOFpdPh4/D/xAAaAQEAAgMBAA AAAAAAAAAAH//Z","=== AI 설비투자 대폭 확대: 부담인가, 전략적 해자인가 ===","2분기 실적 발표와 함께 Alphabet은 올해 자본 지출 가이던스를 150억 달러 상향한 약 2,000억 달러로 제시했으며, 내년에는 더 큰 규모의 지출이 예정되어 있음을 시사했다. FactSet에 따르면 애널리스트들은 2027년 Alphabet의 자본 지출이 2,570억 달러에 달할 것으로 추산하는데, 이는 Amazon, Meta, Microsoft를 모두 웃도는 수준이다.","이 같은 지출 규모는 컨센서스 추정치가 맞는다면 잉여현금흐름(free cash flow)을 마이너스로 전환할 수 있다. 그러나 이는 동시에 Alphabet이 AI 투자 경쟁에서 가장 마지막에 손을 드는 기업이 될 가능성이 높다는 의미이기도 하다. 경쟁사가 지출 감축을 강요받는 상황이 오더라도 Alphabet은 기술 경쟁력을 유지할 수 있다는 분석이다.","Alphabet은 올해 채권 발행으로 약 600억 달러, 지난 6월 주식 발행으로 약 850억 달러를 조달했으며, 2분기 말 기준 현금 및 유가증권 보유액은 2,420억 달러에 달한다. 경쟁사 대비 풍부한 실탄을 갖춘 만큼 AI 투자를 지속할 여력도 가장 크다는 평가다.","=== Gemini 3.5 Pro 출시 지연: 치명타는 아니다 ===","Alphabet은 AI 모델 경쟁에서 다소 뒤처진 상황이다. 최신 플래그십 모델 Gemini 3.5 Pro는 당초 6월 출시 예정이었으나 수 주째 지연되고 있다. AI 세계에서 출시 지연은 뒤처지면 따라잡기 어렵다는 점에서 분명 나쁜 소식이며, Meta Platforms도 최근 이 교훈을 경험한 바 있다.","그러나 Alphabet에게 이 지연이 미치는 타격은 제한적일 것으로 보인다. Meta와 달리 Alphabet은 이미 탄탄한 기업 고객층을 확보하고 있어, 단기간의 지연으로 고객이 이탈할 가능성은 낮다. 기업용 AI 서비스인 Gemini Enterprise는 올해 1분기에 유료 활성 사용자가 전 분기 대비 40% 증가했다고 Sundar Pichai CEO가 밝혔다.","__IMG__:data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCAOfBGUDASIAAhEBAxEB/8QAHAABAAMBAQEBAQAAAAAAAAAAAAMFBgQHAgEI/8QAWBAAAQMDAQQGCAEIBgYIBQIHAAECAwQFEQYSEyExBxRBUZGhIiNSU2FjcYEyFRdCVaSxwdIWM2JygtE2krLC4fAIJDRDc3SisyU3dZPxJjVUJ0RGhJTT/8QAGgEBAAMBAQEAAAAAAAAAAAAAAAIDBAEFBv/EADQRAQACAgAEBAMGBgIDAAAAAAABAgMRBBIhMRMiQVEyYXEFFIGRobEjM0LB0fAVUiRi4f/aAAwDAQACEQMRAD8A9xAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAR1E8VNBJPUSNjhjar3veuEaic1VTzi49MFuiqXR222VFZG1f6xz92ip3omFXH1wB6WDKaQ15atUSLTQpJTViJncS49JO1WqnP95qwABxXq4stFpq7jLG6RlNGsjmNXiqJ3AdoKfSl/h1LaG3KnhkhY57mbEioq8PoXAAAAAAAAMHrTXNdab5BYrDbm1lwkajl3mVT AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD//Z","Alphabet은 최근 더 효율적인 경량 모델 출시에 집중하는 전략을 병행하고 있다. 내부적으로도 고객 사이에서도 컴퓨팅 자원 확보 경쟁이 치열한 상황에서, 응답 속도가 빠른 효율적 모델은 초고성능 모델 못지않게 사용자 유치와 유지에 중요한 경쟁 요소가 될 수 있다.","=== cloud 급성장과 TPU 칩 판매: 새로운 성장 동력 ===","cloud 부문에서 Alphabet의 위상은 빠르게 높아지고 있다. 2분기 cloud 매출 248억 달러는 전년 동기 대비 82% 급증한 수치다. 업계 1위 Amazon Web Services가 1분기 376억 달러를 기록하며 28% 성장에 그쳤고, 2위 Microsoft의 cloud 사업이 40% 성장을 기록한 것과 비교하면 Alphabet의 성장 속도가 두드러진다.","더불어 Google은 자체 설계 AI 가속 칩인 TPU를 기업 고객의 자체 데이터센터용으로 판매하기 시작했다. 이를 통해 내년부터 상당한 추가 매출이 발생할 것으로 회사 측은 기대하고 있다. AI 수요가 꺾이지 않는 한 Alphabet이 cloud 시장 점유율을 꾸준히 확대할 것이라는 전망이 힘을 얻는다.","=== 단기 노이즈 vs. 중장기 전망 ===","Alphabet의 주가는 올해 들어 Nasdaq 종합지수에 다소 뒤처지는 흐름을 보이고 있으며, AI 모델 출시 지연 소식과 중국 저가 AI 모델 경쟁 심화에 대한 우려로 최근 하락 압력을 받았다. 그러나 이러한 우려는 단기적 잡음에 가깝다는 시각이 우세하다.","광고 지출의 견조한 흐름, cloud 부문의 폭발적 성장, AI 설비투자를 뒷받침하는 풍부한 현금, 그리고 기업 고객 기반의 충성도를 종합하면, Alphabet의 중장기 성장 전망은 여전히 밝다는 결론이 나온다."],"image":"","imageCaption":"","author":"","date":"JUL 26, 2026","time":"13:05","url":"","readTime":"3분","credibility":null,"isNew":true},{"id":"3","source":"wccftech","sourceName":"wccftech","sourceDate":"JUL 26, 2026","sourceUrl":"https://wccftech.com/apple-lpddr-memory-margin-shift/","category":"테크","tag":"산업 분석","title":"Apple의 20년 협상력이 흔들린다…LPDDR 메모리 주도권 역전","titleEn":"Apple Is Facing A Shift It Never Encountered In Its Two-Decade History; Meeting Customers Wanting The Same LPDDR Memory, But At Higher Margins","deck":"AI 데이터센터 수요가 LPDDR5X 메모리 시장을 장악하면서, 공급망에서 절대적 우위를 누려온 Apple의 협상력이 빠르게 약화되고 있다.","lede":"수십 년간 막대한 선불 계약으로 공급망을 쥐락펴락했던 Apple이 전례 없는 도전에 직면했다. NVIDIA, AMD, Qualcomm 등 AI 플레이어들이 LPDDR5X SOCAMM2 메모리를 대량으로 쓸어가면서 Apple의 협상 우위가 사실상 무너지고 있다. CEO Tim Cook은 이미 자사의 DRAM 재고가 줄어들고 있다고 경고했으며, Apple은 결국 Mac 등 주요 제품 가격을 인상하기에 이르렀다. 공급망 전문가들은 서버 애플리케이션이 전체 DRAM·NAND 공급의 50%를 차지하는 구조에서 Apple의 입지는 더욱 좁아질 것으로 전망한다.","body":["=== 20년 만에 흔들리는 Apple의 협상력 ===","Apple은 그동안 공급망 협상에서 타의 추종을 불허하는 영향력을 발휘해왔다. 다른 경쟁사들이 엄두도 내지 못할 규모의 선불금을 지급하며 대규모 계약을 독점적으로 체결해온 것이다. 그러나 이제 상황이 역전됐다. Apple은 더 높은 마진을 요구하는 LPDDR 메모리 공급업체들을 상대로 협상 테이블에 앉아야 하는 처지가 됐다.","=== AI 데이터센터가 바꾼 LPDDR5X 메모리 판도 ===","NVIDIA, Micron, AMD, Qualcomm 등 AI 핵심 플레이어들이 LPDDR5X SOCAMM2 RAM을 대량으로 구매하기 시작하면서 이 메모리 타입의 위상이 급격히 높아졌다. LPDDR5X는 DDR5 대비 전력 소비량이 3분의 1 수준으로, 전체 서버 전력의 7%만 차지한다. 좁은 AI 데이터센터 랙 안에서 효율성이 극대화되는 이 특성이 메모리 고객들의 최우선 선택 기준이 된 것이다.","AI 추론 성능 측면에서도 LPDDR5X는 대형 컨텍스트 윈도우와 KV 캐시 처리에 유리해 DDR5를 제치고 서버 메모리의 핵심으로 자리잡았다. 단일 서버 랙 하나에 탑재되는 LPDDR5X 용량은 일반적으로 2TB에 달하는데, 이는 iPhone 17 Pro 및 iPhone 17 Pro Max에 탑재된 12GB의 무려 170배에 해당한다. 수백, 수천 개의 랙이 들어서는 데이터센터 규모를 감안하면 Apple이 상대해야 할 시장의 압박이 얼마나 거대한지 실감할 수 있다.","=== DRAM 재고 고갈과 가격 인상 ===","Tim Cook CEO는 Apple의 DRAM 재고가 빠르게 줄어들고 있다고 직접 경고한 바 있다. 이 위기의 여파로 Apple은 Mac을 포함한 여러 제품의 가격을 인상했다. 상당한 마진을 보유한 Apple이 비용 증가분을 자체적으로 흡수할 여력이 없지 않았음에도 소비자에게 부담을 전가한 것이다.","Trade Whisperer의 데이터에 따르면 모바일 부문의 DRAM 및 NAND 수요는 계속 감소 추세를 보이는 반면, 서버 애플리케이션이 전체 공급량의 50%를 소비하고 있다. 한때 Micron이 Apple의 지나친 단가 압박에 반감을 가질 만큼 강력했던 Apple의 메모리 시장 지배력은 사실상 유명무실해졌다는 평가다.","=== 중국 메모리 업체에 기대는 Apple, 대안은 있나 ===","Apple은 현재 CXMT, YMTC 등 중국 메모리 제조사에 활로를 모색하고 있는 것으로 알려졌다. 그러나 이들 업체가 자국 대표 기업인 Huawei조차 '2순위 고객'으로 대우하는 상황에서, Apple이 안정적인 공급 파트너십을 확보할 수 있을지는 불투명하다. 세계 최대 스마트폰 브랜드 중 하나인 Apple이 메모리 공급망에서 돌파구를 찾기가 갈수록 어려워지고 있다는 분석이 나온다."],"image":"https://cdn.wccftech.com/wp-content/uploads/2026/07/iPhone-17-Pro-Max-logic-board.jpg","imageCaption":"It's tough for Apple knowing that it's now facing an opponent as big as itself / Image credits - iFixit","author":"Omar Sohail","date":"JUL 26, 2026","time":"18:35","url":"https://wccftech.com/apple-lpddr-memory-margin-shift/","readTime":"3분","credibility":null,"isNew":true},{"id":"4","source":"DIGITIMES","sourceName":"DIGITIMES","sourceDate":"JUL 26, 2026","sourceUrl":"https://www.digitimes.com/news/a20260723PD210/auo-technology-automotive-production-market.html","category":"디스플레이","tag":"산업 분석","title":"AUO, Micro LED로 디스플레이 넘어 스마트 인터페이스 플랫폼 도전","titleEn":"AUO's Micro LED push signals a broader shift from displays to smart interfaces","deck":"AUO가 Micro LED 기술을 단순 화면을 넘어 스마트 인터페이스 플랫폼으로 확장하고 있다. 차량용 양산 실적을 발판으로 AR 안경, AI 인프라 등 신규 시장 공략에 나섰다.","lede":"대만 디스플레이 업체 AUO가 Micro LED 기술을 단순 스크린에서 스마트 인터페이스 플랫폼으로 전환하는 전략을 본격화하고 있다. 2026년 1분기 차량용 Micro LED 패널 양산에 성공했으나, 대표 협력 프로젝트인 Honda·Sony 합작 전기차 브랜드 Afeela가 개발 중단을 선언하며 시장의 주목을 받았다. AUO는 이를 개별 기업 전략의 변화로 해석하며, 자동차·웨어러블·AR·AI 인프라 등 다양한 응용처로 포트폴리오를 확장하고 있다. 14년에 걸친 기술 축적과 Gen 4.5 양산 라인이 향후 고객 협상에서 핵심 경쟁력이 될 전망이다.","body":["=== 차량용 Micro LED 양산 달성 ===","AUO는 2026년 1분기 차량용 Micro LED 패널 양산을 시작했다고 밝혔다. AUO 부사장 Jennifer Lin은 한국에서 열린 디스플레이 산업 포럼에서 이 기술이 시연·실험실 검증 단계를 넘어 본격 생산 단계에 진입했음을 확인했다.","가장 주목받은 사례는 Honda와 Sony의 합작 전기차 브랜드 Afeela였다. 이 모델은 세계 최초의 Micro LED 전면 디스플레이 탑재 전기차로 기획됐으며, 2025년 CES에서 AUO와 함께 처음 공개됐다. 그러나 Honda가 전동화 전략을 재편하면서 2026년 3월 해당 프로젝트의 개발 중단을 발표했다.","=== AUO의 해석: 시장 후퇴가 아닌 전략 조정 ===","Jennifer Lin 부사장은 이번 프로젝트 중단이 Micro LED 자동차 시장의 수요 부족을 의미하지 않는다고 강조했다. 이는 전기차 시장 둔화라는 거시적 환경과 개별 기업 전략의 변화가 맞물린 결과라는 설명이다. AUO의 고객군은 전기차에 국한되지 않으며, 다양한 응용처에 맞춰 Micro LED를 최적화할 수 있어 신규 파트너십 확보를 지속 추진 중이다.","업계 분석가들도 차량용 Micro LED는 전기차·내연기관 차량의 구분 없이 프리미엄 모델을 중심으로 채택되기 때문에 단기 시장 변동에 상대적으로 덜 민감하다고 진단한다. 다만 자동차 업계 특유의 긴 인증 사이클이 여전히 수요 확대를 제약하는 요인으로 지목된다.","=== 14년 기술 축적과 Gen 4.5 양산 라인 ===","AUO의 Micro LED 개발은 기술 생태계가 미성숙했던 2012년에 시작됐다. 이후 대량 전사(mass transfer), 수리, 기초 구동 백플레인 설계, 구동 아키텍처, 검사, 캘리브레이션 보상 등 핵심 역량을 내재화했다. 특히 시스템 통합 능력은 경쟁사가 단기간에 따라잡기 어려운 강점으로 꼽힌다.","AUO는 1세대 파일럿 라인에서 Gen 4.5 양산 라인으로 전환한 것을 주요 도약점으로 제시했다. 대형 양산 설비 확보로 고객들이 타당성 평가에서 상업 제품 기획 단계로 넘어갈 수 있게 됐으며, Micro LED의 상용화 경로가 한층 명확해졌다.","=== Garmin 스마트워치부터 AI 인프라까지 ===","AUO는 세계 최초 상업용 Micro LED 스마트워치인 Garmin 제품을 양산 중인 점을 기술 실현 가능성의 증거로 제시했다. 이를 바탕으로 자동차 이외 시장으로 수요 저변을 넓히겠다는 전략이다.","AR 안경 분야에서는 Micro LED의 소형화, 저전력, 빠른 응답속도 특성이 강점으로 작용한다. AUO는 자체 Waveguide 기술도 개발했으며, 광학 효율 향상과 두께·무게 절감을 지속 추진할 계획이다. AI 인프라 시장에서는 Micro LED가 CPO(co-packaged optics)의 저전력 광원으로 활용될 수 있으며, 레이저 광원 대비 발열이 낮고 안정성이 높아 AI 서버의 전력 및 냉각 비용 절감에 기여할 수 있다고 밝혔다.","=== 교차 응용으로 쌓는 기술 해자 ===","Jennifer Lin 부사장은 각 응용 분야의 경험이 서로를 강화한다고 설명했다. 차량용에서 확보한 신뢰성 노하우는 산업용에 적용될 수 있고, 웨어러블 시스템 통합 역량은 미래 스마트 인터페이스 제품에도 이어진다는 논리다. AUO는 이러한 교차 학습이 Micro LED의 주류 시장 진입이 가속화될수록 더 넓은 상업적 해자를 구축하는 기반이 될 것이라고 강조했다."],"image":"https://img.digitimes.com/newsshow/20260723pd210_files/2_b.jpg","imageCaption":"","author":"","date":"JUL 26, 2026","time":"07:47","url":"https://www.digitimes.com/news/a20260723PD210/auo-technology-automotive-production-market.html","readTime":"3분","credibility":null,"isNew":true},{"id":"5","source":"wccftech","sourceName":"wccftech","sourceDate":"JUL 25, 2026","sourceUrl":"https://wccftech.com/micron-ceo-sanjay-mehrotras-bad-blood-with-apple-traces-back-years-report-reveals-amid-chip-standoff-efforts-to-procure-from-chinas-cxmt/","category":"테크","tag":"산업 분석","title":"Apple vs. Micron, 중국 메모리 칩 조달 놓고 백악관서 충돌","titleEn":"Micron CEO Sanjay Mehrotra’s Bad Blood With Apple Traces Back Years, Report Reveals Amid Chip Standoff & Efforts To Procure From China’s CXMT","deck":"Apple이 중국 CXMT산 메모리 칩 조달 허용을 백악관에 로비하는 가운데, Micron CEO Sanjay Mehrotra가 강하게 반발하고 있다. 두 회사의 갈등은 수년 전부터 쌓인 '악연'에서 비롯됐다는 보도가 나왔다.","lede":"Apple과 Micron이 중국 메모리 기업 CXMT 칩 조달을 둘러싸고 정면충돌하고 있다. Wall Street Journal 보도에 따르면 Apple CEO Tim Cook과 Micron CEO Sanjay Mehrotra는 각각 상무장관 Howard Lutnick, 재무장관 Scott Bessent 등 미국 정부 고위 관계자들을 상대로 자신들의 입장을 설득 중이다. 이번 갈등의 배경에는 Apple의 저가 부품 조달·고마진 판매 전략에서 비롯된 양사의 오랜 불신이 자리하고 있다고 The Journal은 전한다.","body":["=== 백악관으로 번진 메모리 칩 전쟁 ===","Apple이 중국 메모리 기업 CXMT로부터 칩을 조달할 수 있도록 백악관에 허용을 촉구하고 있다고 Wall Street Journal이 7월 25일 보도했다. Apple 측은 CXMT산 칩을 활용할 경우 미국 소비자들에게 더 낮은 가격을 제공할 수 있다는 논리를 내세우고 있다.","반면 Micron CEO Sanjay Mehrotra는 중국 메모리 기업을 미국 공급망에 편입시키는 것은 중국 철강·제조업이 미국 산업에 끼친 피해와 같은 결과를 낳을 수 있다며 강하게 반대하고 있다. Mehrotra는 이를 미국 반도체 산업의 자생력을 훼손하는 행위로 규정했다.","=== Apple과 Micron, 수년간 쌓인 '악연' ===","이번 갈등의 밑바닥에는 양사가 오랜 기간 쌓아온 불신이 깔려 있다. Wall Street Journal에 따르면 Apple이 메모리 등 부품을 최저가로 조달한 뒤 프리미엄 가격으로 제품을 팔아 높은 마진을 챙기는 전략이 Mehrotra와의 '악감정(bad blood)'을 키워왔다고 복수의 소식통이 전했다.","특히 이 긴장 관계는 Mehrotra가 스토리지 기업 SanDisk에 재직하던 시절부터 형성됐다고 한다. 당시 그는 Apple 측 관계자와의 면담 자체를 피했을 정도였다고 소식통들은 덧붙였다.","=== CXMT 칩, 이미 테스트 단계 ===","Apple의 CXMT 칩 관심은 단순한 로비에 그치지 않는다. Financial Times는 이달 초 Apple이 CXMT의 DRAM 칩을 실제로 테스트하고 있다고 보도했으며, Bloomberg는 조달이 성사될 경우 주로 중국 내 판매 제품에 적용될 것이라고 전했다.","한편 여러 보고서는 CXMT가 아직 글로벌 메모리 시장에 대규모 영향을 미칠 만한 생산 능력을 갖추지 못했다고 지적하고 있다. 그럼에도 Apple의 공급망 편입 시도는 업계 안팎의 주목을 끌고 있다.","=== Apple 파트너십의 양면성 ===","Apple은 소규모 부품사와 파트너십을 맺을 경우 막대한 주문 물량으로 해당 기업의 생산 규모를 단기간에 크게 키워주는 것으로 알려져 있다. 그러나 동시에 해당 기업들은 Apple 주문에 크게 의존하게 되면서 설비 가동률을 유지하기 위해 Apple의 요구를 수용할 수밖에 없는 구조에 놓이게 된다는 점도 업계의 오랜 지적이다."],"image":"https://cdn.wccftech.com/wp-content/uploads/2026/07/Apple-announces-price-increases-of-nearly-all-products.jpg","imageCaption":"","author":"Ramish Zafar","date":"JUL 25, 2026","time":"12:20","url":"https://wccftech.com/micron-ceo-sanjay-mehrotras-bad-blood-with-apple-traces-back-years-report-reveals-amid-chip-standoff-efforts-to-procure-from-chinas-cxmt/","readTime":"3분","credibility":null,"isNew":true},{"id":"6","source":"wccftech","sourceName":"wccftech","sourceDate":"JUL 24, 2026","sourceUrl":"https://wccftech.com/apple-iphone-18-pro-oled-costs-chiplation/","category":"디스플레이","tag":"산업 분석","title":"Apple, iPhone 18 Pro OLED 가격 20% 인하 압박…\"칩플레이션\" 대응","titleEn":"Apple Squeezes OLED Suppliers As “Chipflation” Drives Up iPhone 18 Pro Production Costs","deck":"Apple이 Samsung과 LG에 iPhone 18 Pro Max용 OLED 패널 가격을 20% 낮추도록 압박하고 있다. A20 Pro 칩 및 DRAM·NAND 가격 급등으로 BoM 부담이 커진 탓이다.","lede":"Apple이 iPhone 18 Pro 시리즈의 생산 원가 상승에 대응하기 위해 주요 OLED 공급사인 Samsung과 LG를 상대로 디스플레이 가격 인하 협상을 벌이고 있다. 2nm 공정 기반의 A20 Pro 칩 가격이 개당 280달러에 달하고, DRAM·NAND 가격 상승까지 겹치며 iPhone 18 Pro Max의 BOM(부품 원가)이 300달러 이상 높아질 수 있다는 전망이 나온다. Apple은 OLED 패널 단가를 낮추는 방식으로 마진 방어에 나선 것으로 보인다.","body":["=== OLED 가격 20% 인하 요구 ===","The Elec의 보도에 따르면, Apple이 iPhone 18 Pro Max용 OLED 패널 목표 단가로 70달러를 제시한 것으로 알려졌다. 현재 Samsung과 LG는 평균 66.50달러까지 가격을 낮출 여력이 있는 것으로 파악된다. 이는 전작 대비 약 20% 인하된 수준이다.","iPhone 17 Pro Max의 OLED 평균 단가는 80달러였으며, iPhone 16 Pro Max 패널은 100달러를 넘기도 했다. iPhone 18 Pro와 iPhone 18 Pro Max에 모두 탑재될 최신 M16 OLED 패널은 발광 효율, 수명, 색 표현력이 향상돼 배터리 수명 개선에도 기여할 것으로 전망된다.","=== Samsung·LG가 인하를 수용할 수밖에 없는 이유 ===","Apple이 이번 협상에서 유리한 고지를 점하는 것은 iPhone의 압도적인 출하량 덕분이다. iPhone 18 Pro·Pro Max는 대규모 판매가 예상되는 만큼, Samsung과 LG 입장에서도 단가를 낮추더라도 충분한 수익을 확보할 수 있다는 판단이 깔려 있다. 다른 스마트폰 제조사였다면 이 같은 대규모 물량을 보장하기 어려워 협상 자체가 성사되지 않았을 것이라는 분석이다.","=== '칩플레이션'이 부품 원가를 끌어올리다 ===","DRAM 가격 급등 사태 이전에는 OLED 패널이 iPhone BOM에서 가장 큰 비중을 차지했다. 하지만 이제는 Apple의 첫 2nm SoC인 A20 Pro의 개당 단가가 280달러에 달하는 것으로 추정된다. 여기에 DRAM과 NAND 플래시 가격 상승까지 더해지면 iPhone 18 Pro Max의 총 BOM이 300달러 이상 높아질 수 있다는 우려도 제기된다.","Apple로서는 OLED 패널 원가 절감이 현재로선 가장 실질적인 비용 상쇄 수단이다. 부품 조달 전략에서 추가적인 변화가 생길 경우, 업계의 이목이 집중될 전망이다."],"image":"https://cdn.wccftech.com/wp-content/uploads/2026/07/LTPO-for-the-iPhone-18-Pro-and-iPhone-18-Pro-Max.jpg","imageCaption":"Everything is getting pricey now","author":"Omar Sohail","date":"JUL 24, 2026","time":"12:20","url":"https://wccftech.com/apple-iphone-18-pro-oled-costs-chiplation/","readTime":"2분","credibility":null,"isNew":true},{"id":"7","source":"wccftech","sourceName":"wccftech","sourceDate":"JUL 24, 2026","sourceUrl":"https://wccftech.com/cxmts-64gb-server-ddr5-memory-chip-is-now-pricier-than-samsungs-as-it-races-to-increase-capacity-to-600000-wafers-per-month/","category":"테크","tag":"산업 분석","title":"CXMT의 64GB DDR5, Samsung보다 비싸졌다…생산능력 60만 장 확대 질주","titleEn":"CXMT’s 64GB Server DDR5 Memory Chip Is Now Pricier Than Samsung’s, As It Races To Increase Capacity To 600,000 Wafers Per Month","deck":"중국 메모리 업체 CXMT의 서버용 64GB DDR5 모듈 가격이 Samsung을 추월했다. CXMT는 2030년까지 Micron을 제치겠다는 목표 아래 생산능력을 공격적으로 늘리고 있다.","lede":"중국 메모리 업체 CXMT가 서버용 64GB DDR5 모듈을 Samsung보다 높은 가격에 판매하기 시작했다. 가격 결정권을 쥔 '빅3(Samsung, SK hynix, Micron)'의 전략을 그대로 답습하는 모습이다. 현재 월 20만 장 수준인 웨이퍼 생산능력을 연말까지 30만 장, 장기적으로는 60만 장까지 확대할 계획이며, 기술 고도화도 병행 중이다. Apple의 CXMT 칩 도입 검토까지 맞물리며 글로벌 메모리 시장의 판도 변화에 이목이 집중된다.","body":["=== Samsung 넘어선 CXMT의 가격 전략 ===","Reuters에 따르면 중국 메모리 업체들이 고객사 선택과 가격 결정에서 우위를 점하기 시작했다. CXMT의 서버용 64GB DDR5 모듈은 Samsung이 현재 약 $1,240에 판매하는 동급 제품보다 더 높은 가격에 거래되고 있다.","이는 CXMT가 Samsung, SK hynix, Micron 등 메모리 '빅3'가 구사해온 가격 주도 전략을 그대로 채택했음을 보여주는 상징적인 사례다. 불과 수년 전까지만 해도 저가 공세로 시장에 진입하던 중국 업체의 행보치고는 이례적이라는 평가가 나온다.","=== Huawei 연계 엔지니어 추방 사건 ===","CXMT의 달라진 위상을 보여주는 또 다른 사건도 있었다. CXMT는 Huawei와 연계된 장비 업체 SiCarrier 소속 엔지니어들을 허페이(Hefei) 팹에서 전격 퇴출시켰다. 해당 엔지니어들은 클린룸 내 장비 유지보수를 지원하던 중 갑작스럽게 퇴장 통보를 받았고, SiCarrier는 Huawei의 강경한 가격 항의가 이 사태를 촉발했을 가능성이 있다고 결론지었다.","=== 공격적인 생산능력 확대 ===","CXMT는 현재 월 약 20만 장인 웨이퍼 생산능력을 2025년 말까지 30만 장으로 늘릴 계획이다. 여기서 멈추지 않고 상하이(Shanghai)와 허페이에 신규 팹 두 곳을 건설 중이며, 이를 통해 생산능력을 최대 월 60만 장까지 끌어올린다는 구상이다. 이 같은 속도라면 2030년에는 물량 기준으로 Micron을 추월할 수 있다는 전망도 나온다.","=== 차세대 기술: W2W 하이브리드 본딩 ===","기술력 측면에서도 CXMT의 행보가 주목된다. CXMT는 차세대 본딩 DRAM 구현을 위해 W2W(Wafer-to-Wafer) 하이브리드 본딩 기술을 연구 중이다. 이 기술은 메모리 셀과 컨트롤 로직 회로를 별개의 웨이퍼에 제작한 뒤 수직으로 접합하는 방식으로, 메모리 밀도를 획기적으로 높이고 지연시간을 줄이며 전력 효율도 개선할 수 있다. 현재 허페이의 파일럿 라인에서 테스트 중이며, 고밀도 메모리 양산이 최종 목표다.","=== Apple의 CXMT 채택 가능성 ===","한편 Apple은 중국 내 판매 제품에 CXMT 메모리 칩을 탑재하는 방안을 검토 중인 것으로 알려졌다. Apple은 CXMT가 미국 상무부의 Entity List에 오르지 않도록 Trump 행정부에 보증을 요청하고 있는 것으로 전해진다. Entity List에 등재된 기업과는 별도의 허가 없이 거래할 수 없어, Apple로서는 사전에 리스크를 차단하려는 포석으로 풀이된다."],"image":"https://cdn.wccftech.com/wp-content/uploads/2026/07/CXMT-DDR5-Memory-_F.jpg","imageCaption":"","author":"Rohail Saleem","date":"JUL 24, 2026","time":"11:06","url":"https://wccftech.com/cxmts-64gb-server-ddr5-memory-chip-is-now-pricier-than-samsungs-as-it-races-to-increase-capacity-to-600000-wafers-per-month/","readTime":"3분","credibility":null,"isNew":true},{"id":"8","source":"DIGITIMES","sourceName":"DIGITIMES","sourceDate":"JUL 24, 2026","sourceUrl":"https://www.digitimes.com/news/a20260724PD234/huawei-development-production-manufacturing-2026.html","category":"테크","tag":"산업 분석","title":"Huawei 창업자, \"τ Law만이 우리의 유일한 길\"…포스트 Moore 시대 전략 공식화","titleEn":"Huawei founder endorses Tau Law as sole path for post-Moore chip development","deck":"Huawei 창업자 Ren Zhengfei가 자사의 τ(타우) Law를 반도체 발전의 유일한 전략 경로로 공식 지지했다. 6년간의 연구 끝에 개발된 이 접근법은 Moore의 법칙을 대체할 새로운 패러다임으로 제시됐다.","lede":"Huawei 창업자 Ren Zhengfei가 자사의 τ(타우) Law를 포스트 Moore 시대 반도체 개발의 유일한 전략 경로로 공식 지지하고 나섰다. 첨단 공정 기술 접근이 제한된 상황에서 Huawei가 6년간 독자 개발해온 'τ Scaling(시간 스케일링)' 이론을 기업 차원의 핵심 전략으로 격상시킨 것이다. Huawei는 이 프레임워크를 기반으로 이미 381개의 칩을 설계·양산했으며, 2026년 가을 출시 예정인 차세대 Kirin 프로세서에도 적용할 계획이다. 회사는 2031년까지 이 기술로 1.4nm 공정에 준하는 트랜지스터 밀도를 달성할 수 있다고 전망한다.","body":["=== Ren Zhengfei의 공식 지지 선언 ===","Huawei 창업자 Ren Zhengfei가 사내 플랫폼 Xinsheng Community에 게재한 글을 통해 τ Law를 Huawei의 공식 기술 전략으로 지지한다고 밝혔다. 그는 '다른 기업들에게는 여러 선택지가 있지만, Huawei에게 생존과 지속 가능한 성장은 이 길에 달려 있다. 지난 6년간 수만 명의 직원이 반복적인 반복 작업을 통해 이를 다듬어왔다. 우리는 누군가를 대체하려는 것이 아니라, 우리만의 길을 찾고 있는 것이다'라고 밝혔다.","이번 선언은 Huawei 반도체 사업부 사장 He Tingbo와의 사내 인터뷰 '계속 전진하면 다리가 나타난다'와 함께 발표됐다. Ren은 노자의 도덕경 첫 구절 '말할 수 있는 도는 영원한 도가 아니다'를 재해석해, '길은 만들 수 있다. 반드시 기존의 길일 필요는 없다. 그 길이 바로 영원한 길이 된다'는 철학적 메시지를 기업 기술 전략에 접목시켰다.","=== τ Law란 무엇인가 ===","τ Law(타우 법칙)는 Moore의 법칙이 기반으로 하는 기하학적 공정 미세화 대신, 시스템의 시간 상수(τ)를 지속적으로 줄이는 방식으로 성능을 향상시키는 개념이다. 로직 폴딩(logic folding)과 하이브리드 본딩(hybrid bonding) 등의 기술을 결합해, 더 앞선 공정 노드에 의존하지 않고도 트랜지스터 밀도와 전체 시스템 성능을 개선할 수 있다고 주장한다.","He Tingbo는 2026년 5월 '새로운 반도체 경로의 탐색과 실천'이라는 발표를 통해 τ Law를 공식 소개한 바 있다. 이달 초에는 논문 '다층 전자 시스템을 위한 시간 스케일링 이론' 제2판을 공개했으며, 이 업데이트 버전에는 엔지니어링 구현 세부사항, 대량 생산 검증 데이터, 제품 로드맵 정보가 추가됐다.","=== 성능 지표와 Kirin 2026 비교 데이터 ===","Huawei는 이번 논문에서 처음으로 차세대 Kirin 2026 프로세서와 Kirin 9030 Pro의 생산 테스트 결과를 공개했다. 비교 항목은 동작 전압, 클록 주파수, 정규화 전력 소비, 칩 면적, 전력 밀도 등이다.","논문에 따르면, 로직 폴딩 기술을 적용하면 동일한 공정 노드에서 트랜지스터 밀도를 55% 향상시키고 에너지 효율을 41% 개선할 수 있다고 밝혔다. Huawei는 2026년 가을 로직 폴딩 기술을 탑재한 차세대 Kirin 스마트폰 프로세서를 출시할 계획이다.","=== 2031년 로드맵과 업계 과제 ===","Huawei는 τ Law 프레임워크 기반의 고성능 칩이 2031년까지 1.4nm 공정에 상응하는 트랜지스터 밀도를 달성할 수 있을 것으로 전망한다. 지난 6년간 이 프레임워크를 기반으로 설계·양산한 칩은 총 381개에 달한다.","다만, 회사 스스로도 현재 연구 결과가 주로 Huawei 자체 연구 및 제품 데이터에 기반하고 있음을 인정했다. τ Scaling이 폭넓은 업계 채택을 얻어 새로운 반도체 설계 패러다임으로 자리잡을 수 있을지는 결국 시장과 공급망의 광범위한 검증에 달려 있다는 점도 명시했다."],"image":"https://img.digitimes.com/newsshow/20260724pd234_files/2_b.jpg","imageCaption":"","author":"","date":"JUL 24, 2026","time":"16:29","url":"https://www.digitimes.com/news/a20260724PD234/huawei-development-production-manufacturing-2026.html","readTime":"3분","credibility":null,"isNew":true},{"id":"9","source":"TrendForce","sourceName":"TrendForce","sourceDate":"JUL 24, 2026","sourceUrl":"https://www.trendforce.com/news/2026/07/24/news-chinas-dram-maker-cxmt-to-debut-jul-27-ipo-to-raise-rmb-57-9b-largest-on-star-market-since-launch/","category":"기업","tag":"산업 분석","title":"중국 DRAM 기업 CXMT, 7월 27일 STAR Market 상장…역대 최대 IPO","titleEn":"China’s DRAM Maker CXMT to Debut Jul. 27; IPO to Raise RMB 57.9B, Largest on STAR Market Since Launch","deck":"중국 DRAM 업체 CXMT가 7월 27일 상하이 STAR Market에 상장한다. 공모 규모는 579억 위안으로 SMIC의 기록을 넘어 STAR Market 사상 최대 IPO가 된다.","lede":"중국 최대 DRAM 제조사 CXMT가 2026년 7월 27일 상하이 STAR Market에 공식 상장한다. 주당 공모가 8.66위안을 기준으로 한 기업 가치는 약 5,791억 9,000만 위안에 달하며, 기본 공모만으로도 SMIC의 종전 최고 기록인 532억 위안을 넘어선다. 조달 자금은 생산라인 고도화, DRAM 기술 업그레이드, 미래 기술 R&D 등 세 분야에 집중 투자될 예정이다. 1분기 실적 역시 매출과 순이익 모두 폭발적인 성장세를 기록하며 시장의 기대를 높이고 있다.","body":["=== STAR Market 사상 최대 IPO ===","CXMT는 2026년 7월 27일 상하이 STAR Market에 상장할 예정이다. Securities Times를 인용한 MoneyDJ 보도에 따르면, 주당 공모가 8.66위안 기준으로 CXMT의 기업 가치는 약 5,791억 9,000만 위안으로 평가된다.","기본 공모를 통해 조달하는 금액은 약 579억 1,900만 위안으로, 이는 SMIC가 보유하고 있던 STAR Market 최대 IPO 기록인 532억 위안을 넘어서는 수치다. 인수단이 초과 배정 옵션을 전량 행사할 경우 총 조달액은 최대 약 666억 위안까지 늘어날 수 있다.","=== IPO 자금 배분 계획 ===","상장 공고에 따르면 CXMT는 IPO 순수익을 세 가지 핵심 분야에 나누어 투자할 계획이다. 먼저 75억 위안 전액을 메모리 웨이퍼 제조 생산라인 고도화에 사용한다.","총 투자 계획액이 180억 위안에 달하는 DRAM 기술 고도화 프로젝트에는 130억 위안이 배정된다. 나머지 90억 위안은 미래 기술 R&D 프로그램에 전액 투입될 예정이다.","=== 폭발적인 실적 성장세 ===","투자설명서에 따르면 CXMT의 2026년 1분기 매출은 508억 위안으로 전년 동기 대비 719.13% 급증했다. 순이익은 330억 1,200만 위안으로 1,268.45% 늘었으며, 주주 귀속 순이익은 247억 6,200만 위안으로 1,688.30% 증가했다.","회사는 2026년 상반기 매출이 1,100억~1,200억 위안에 달할 것으로 예상하고 있으며, 이는 전년 동기 대비 612.53%~677.31% 성장에 해당한다. 주주 귀속 순이익도 500억~570억 위안으로 전년 동기 대비 최대 2,544.19% 성장할 것으로 전망된다.","=== 주주별 의무 보호예수 기간 ===","CXMT는 주주 유형에 따라 다양한 보호예수 조건을 공개했다. IPO 이전 기존 주주들의 보유 주식은 12개월 또는 36개월의 의무 보호예수가 적용된다.","상장주관사 계열 자회사가 전략 투자 프로그램을 통해 취득한 주식은 상장일로부터 24개월간 매각이 제한된다. 경영진 및 핵심 직원을 위해 구성된 자산관리 플랜에 배정된 주식은 36개월, 그 외 전략 배정 투자자는 12~36개월의 보호예수 기간이 적용된다. 기관 투자자에게 최종 배정된 주식 중 70%는 6개월간 의무 보유해야 한다."],"image":"","imageCaption":"","author":"","date":"JUL 24, 2026","time":"00:00","url":"https://www.trendforce.com/news/2026/07/24/news-chinas-dram-maker-cxmt-to-debut-jul-27-ipo-to-raise-rmb-57-9b-largest-on-star-market-since-launch/","readTime":"3분","credibility":null,"isNew":true},{"id":"10","source":"TrendForce","sourceName":"TrendForce","sourceDate":"JUL 24, 2026","sourceUrl":"https://www.trendforce.com/news/2026/07/24/news-sk-hynix-reportedly-hires-for-3d-stacked-dram-on-logic-with-a-u-s-customer-targets-on-device-ai/","category":"테크","tag":"산업 분석","title":"SK hynix, 미국 고객사와 손잡고 3D DRAM-on-Logic 개발 본격화","titleEn":"SK hynix Reportedly Hires for 3D-Stacked DRAM-on-Logic With a U.S. Customer; Targets On-Device AI","deck":"SK hynix가 온디바이스 AI용 차세대 메모리 기술인 3D-Stacked DRAM-on-Logic 전담 엔지니어 채용에 나섰다. 미국 고객사와 협력해 상용화 준비를 가속하는 행보로 주목된다.","lede":"SK hynix가 차세대 온디바이스 AI 메모리 기술인 3D-Stacked DRAM-on-Logic 개발을 본격화하고 있다. ZDNet 보도에 따르면, SK hynix는 캘리포니아주 산호세 소재 미국 법인을 통해 관련 설계 엔지니어 채용을 시작했으며, 특정 미국 고객사와 공동 개발 파트너십을 맺은 것으로 알려졌다. 이 기술은 DRAM을 SoC 위에 수직 통합하는 고급 패키징 아키텍처로, 기존 PoP 방식의 한계를 뛰어넘을 차세대 메모리 솔루션으로 주목받고 있다.","body":["=== 3D DRAM-on-Logic 전담 채용, SK hynix 최초 ===","SK hynix가 3D-Stacked DRAM 전담 전문 인력 채용에 나선 것은 이번이 처음이다. 온디바이스 AI용 차세대 메모리 솔루션으로 주목받는 이 기술의 상용화 준비를 위한 초기 포석으로 해석된다.","채용 공고에 따르면, SK hynix는 미국 고객사와 긴밀히 협력해 3D-Stacked DRAM-on-Logic용 로직 다이를 공동 설계할 엔지니어를 찾고 있다. 이 기술은 DRAM을 SoC 바로 위에 수직으로 직접 통합하는 첨단 패키징 아키텍처다.","=== PoP의 한계를 넘는 기술적 차별점 ===","3D-Stacked DRAM-on-Logic은 각각 패키징된 칩을 쌓는 기존 Package-on-Package(PoP) 방식과 달리, 동일한 면적 내에서 훨씬 짧은 인터커넥트와 더 많은 데이터 I/O 채널을 구현할 수 있다. 이를 통해 데이터 전송 지연을 줄이는 동시에 전력 효율과 공간 활용도를 크게 개선할 수 있다.","이 기술은 높은 메모리 대역폭과 낮은 전력 소비를 동시에 요구하는 온디바이스 AI 애플리케이션을 주요 타깃으로 삼고 있다. 기존 PoP 아키텍처가 성능 병목으로 지목되는 상황에서, 스마트폰의 핵심 프로세서인 모바일 AP가 가장 유망한 적용처로 꼽힌다. Apple과 Qualcomm이 모바일 AP의 선두 설계사로 언급된다.","=== TSMC 심포지엄에서 공개한 로드맵과의 연계 ===","이번 행보는 SK hynix가 TSMC Technology Symposium 2026에서 공개한 로드맵과도 맞닿아 있다. SK hynix 사장 겸 최고개발책임자(CDO) Hyun Ahn은 AI 개발이 메모리 병목으로 인해 점점 더 제약받고 있으며, 점진적인 개선을 넘어선 새로운 메모리 아키텍처가 필요하다고 밝혔다.","그는 SK hynix가 TSMC와 협력해 HBM4 베이스 다이에 TSMC의 첨단 로직 공정을 적용 중이며, 이를 High Bandwidth Flash(HBF)와 3D-Stacked DRAM-on-Logic으로 확대해 메모리와 로직의 통합도를 높이고 성능 및 전력 효율을 더욱 개선할 계획이라고 설명했다.","=== Samsung Electronics도 차세대 3D DRAM 연구 진행 중 ===","Samsung Electronics 역시 차세대 3D DRAM 연구를 가속하고 있다. Newspim에 따르면, Samsung은 최근 imec, KU Leuven, Lam Research와 공동으로 산화물 반도체 채널을 활용한 모놀리식 3D DRAM 아키텍처에 관한 논문을 발표했다.","다만 해당 연구는 아직 시뮬레이션 단계에 머물러 있으며, 구체적인 상용화 계획은 공개되지 않은 상태다."],"image":"","imageCaption":"","author":"","date":"JUL 24, 2026","time":"00:00","url":"https://www.trendforce.com/news/2026/07/24/news-sk-hynix-reportedly-hires-for-3d-stacked-dram-on-logic-with-a-u-s-customer-targets-on-device-ai/","readTime":"2분","credibility":null,"isNew":true},{"id":"11","source":"DIGITIMES","sourceName":"DIGITIMES","sourceDate":"JUL 24, 2026","sourceUrl":"https://www.digitimes.com/news/a20260723VL229/nvidia-ai-chip-training-huawei-infrastructure.html","category":"테크","tag":"산업 분석","title":"중국 AI 칩 점유율 50% 돌파, Nvidia의 아성은 여전","titleEn":"China's AI chip share tops 50%, but Nvidia still rules frontier training","deck":"Goldman Sachs는 2026년 중국 내 AI 칩 출하량의 절반 이상을 자국 기업이 차지할 것으로 전망했다. 그러나 최첨단 훈련 영역에서 Nvidia의 지배력은 쉽게 흔들리지 않는다.","lede":"미국의 수출 규제와 중국 정부의 자국 산업 육성 정책에 힘입어 Huawei, Cambricon, Hygon 등 중국 AI 칩 기업들이 빠르게 시장 점유율을 높이고 있다. Goldman Sachs는 2026년 중국 내 AI 칩 출하량에서 자국 공급사 비중이 50%를 넘어설 것으로 내다봤다. 그러나 성능·소프트웨어 성숙도·에너지 효율 등 핵심 지표에서 Nvidia는 여전히 한 세대 앞서 있다는 평가다. 중국 AI 인프라 시장은 '점유율 확대'와 '기술 격차'라는 두 가지 현실 사이에 놓여 있다.","body":["=== 중국 AI 칩 시장 판도 변화 ===","Goldman Sachs는 2026년 중국 국내 AI 칩 출하량에서 Huawei, Alibaba 산하 T-Head Semiconductor, Cambricon, Hygon 등 자국 기업들의 합산 점유율이 50%를 초과할 것으로 예상했다. 미국의 수출 통제, 정부 조달 정책, 중국 클라우드 기업들의 자국 칩 투자가 맞물린 결과다.","Bernstein은 The Economist를 인용해 Huawei가 가속기 시장의 50%를 점유하고, Nvidia의 규정 준수 제품 점유율은 8%에 그친다고 추정했다. IDC와 Bernstein은 국내 공급사의 AI 가속기 서버 출하 점유율이 2025년 41~46%에서 2026년 약 56%로 상승할 것으로 전망했다.","반면 Goldman Sachs는 Nvidia가 2026년 중국 AI 칩 출하량의 55%를 유지하며 선두를 지킬 것으로 보고, Huawei Ascend가 20%, Alibaba T-Head가 7%로 뒤를 이을 것으로 추산했다. 조사 기관별 정의와 기준의 차이가 수치 간 격차를 만들어내고 있다.","=== 수출 규제와 자국 칩 투자 가속 ===","미국의 H100, H200, H20 수출 제한 조치는 중국 내 자국 칩 전환을 크게 앞당겼다. Bernstein은 연간 가속기 매출을 Huawei 121억 달러, AMD 30억 달러, Cambricon 21억 달러, Hygon 20억 달러, Alibaba 12억 달러, Baidu 7억 달러로 추정했다.","Z.ai는 자국산 칩만으로 구축한 1GW 규모의 데이터센터를 부분 가동하기 시작했으며, 각 클러스터에 국산 칩 1만 개 이상이 탑재됐다고 Sina가 보도했다. 중국은 향후 5년간 데이터센터에 약 2조 위안(약 2,950억 달러)을 투자할 계획이다.","이 발표에 힘입어 Z.ai 주가는 7월 21일 장중 41% 급등에 이어 36.9% 상승한 홍콩달러 1,219로 마감했다. 항셍테크지수도 1.3% 올랐고, Hua Hong Semiconductor와 Montage Technology는 17% 이상, MiniMax는 15% 이상 상승했다.","=== 시장 성장 전망 ===","Deutsche Bank는 중국 AI 칩 출하량이 2025년 400만 개에서 2026년 500만 개로 늘어나고, 향후 2~3년간 연간 30% 이상 성장할 것으로 전망했다. JPMorgan은 국내 AI 칩 출하량이 2025년 100만 개에서 2028년 500만 개로 급증할 것으로 예상했다.","고객 구성 측면에서 Goldman Sachs는 인터넷 기업이 Huawei Ascend 2026년 출하량의 63%, Cambricon의 60%를 차지할 것으로 추산했다. 정부 구매자는 각각 15%를 기여하며, Hygon 매출의 약 35%는 공공 부문이 차지한다. T-Head의 경우 인터넷 기업 비중이 23%에 달한다.","=== 기술 성능 격차 ===","순수 성능 면에서 Nvidia와의 격차는 여전히 뚜렷하다. Goldman Sachs에 따르면 Huawei Ascend 910B 시스템의 일일 토큰 생성량은 약 4억 개이며, 910C는 8억 개로 향상되지만, Nvidia H800은 26억 개에 달한다.","Huawei의 신형 950PR은 수출 허용 제품인 H20과 비교적 경쟁력을 갖춰, FP4 기준 1.56 PFLOPS(H20은 0.56 PFLOPS)를 기록하며 112GB 고대역폭 메모리와 2TB/s 인터커넥트 대역폭을 제공한다. 그러나 Nvidia의 글로벌 플래그십 제품들은 여전히 압도적으로 앞선다. H100은 FP8 기준 3.96 PFLOPS, B200은 FP4 기준 최대 18 PFLOPS와 8TB/s 메모리 대역폭을 제공한다.","비용 효율 측면에서도 격차가 존재한다. Goldman Sachs는 Nvidia 인프라의 EFLOPS당 비용을 약 2,400만 위안으로 추정하는 반면, Huawei는 5,100만 위안, 일부 중국 슈퍼노드 시스템은 1억 위안 이상에 달한다. Huawei의 CM384는 약 1억 3,500만 위안에 800kW를 소비하며, 고밀도 설계로 서버 수는 줄이지만 전력·냉각·인프라 부담이 높아진다.","=== 소프트웨어·생태계 경쟁 ===","Huawei는 자사 CANN Next 소프트웨어가 CUDA와 약 80% 호환성에 도달했다고 밝혔으나, 마이그레이션과 최적화 비용은 여전히 남아 있다. 이에 따라 경쟁의 무게중심이 칩 단위 성능에서 하드웨어·소프트웨어·클라우드 생태계 전반으로 이동하고 있다.","향후 AI 데이터센터 워크로드에서 추론(inference)이 50% 이상을 차지할 것으로 예상되며, 훈련은 20~30%, 풀스택 연구는 10~20%에 그칠 전망이다. 이 같은 구조 변화는 안정적이고 저비용 배포 환경을 제공하는 공급사에 유리하게 작용하며, Huawei·T-Head·Cambricon은 칩 단독 성능보다 시스템 전체 효율을 내세우는 전략을 구사하고 있다.","=== 전망: 공존과 경쟁 ===","일부 중국 모델 개발사들은 Huawei Ascend와 비공식 경로로 확보한 Nvidia 칩을 혼용하는 하이브리드 클러스터를 운영하는 것으로 알려졌다. B300급 서버는 대당 약 100만 달러에 거래되는 것으로 전해지며, 최첨단 훈련 영역에서 Nvidia에 대한 수요가 여전히 강하다는 점을 방증한다.","Moonshot AI의 Kimi K3가 자국 칩만으로 훈련됐다는 중국 측 주장도 있으나, 선도적인 AI 연구소들이 가장 고난도 작업에 제한된 Nvidia 하드웨어를 계속 찾고 있다는 정황이 더 광범위하게 관측된다. Bernstein은 중국 AI 칩 매출이 연평균 74% 성장하고 있으며, 자국 공급이 2026년 수요의 39%를 충당하다가 2028년에는 100%를 초과할 것으로 전망했다. 결국 Huawei, Cambricon, Hygon이 공급 부족 해소 이후에도 성능·소프트웨어·에너지 효율·총소유비용 경쟁력을 증명해야 한다는 과제가 남는다."],"image":"https://img.digitimes.com/newsshow/20260723vl229_files/2_b.jpg","imageCaption":"","author":"","date":"JUL 24, 2026","time":"06:29","url":"https://www.digitimes.com/news/a20260723VL229/nvidia-ai-chip-training-huawei-infrastructure.html","readTime":"4분","credibility":null,"isNew":true},{"id":"12","source":"DIGITIMES","sourceName":"DIGITIMES","sourceDate":"JUL 24, 2026","sourceUrl":"https://www.digitimes.com/news/a20260723VL224/deepseek-ai-chips-nvidia-software-efficiency.html","category":"테크","tag":"산업 분석","title":"DeepSeek 창업자 \"중국 AI, 미국보다 18개월 뒤처져…핵심은 컴퓨팅 파워\"","titleEn":"DeepSeek's Liang Wenfeng says China trails US AI by up to 18 months, with compute the decisive gap","deck":"DeepSeek 창업자 Liang Wenfeng이 4시간 가까운 투자자 미팅에서 중국 AI의 현주소를 진단했다. 인재가 아닌 컴퓨팅 파워 부족이 미국과의 격차를 만드는 결정적 요인이라고 밝혔다.","lede":"DeepSeek 창업자 Liang Wenfeng이 중국 AI 산업은 미국에 비해 6~18개월 뒤처져 있으며, 그 주된 원인은 인재 부족이 아닌 컴퓨팅 파워의 한계에 있다고 말했다. 약 4시간에 걸친 투자자 미팅에서 그는 미중 AI 경쟁, 국산 칩, AGI(범용 인공지능), DeepSeek의 비즈니스 모델 등 118개 질문에 답했다. 해당 내용은 Tencent Technology가 정리해 공개했다. DeepSeek은 더 적은 자원으로 미국 수준에 근접한 모델을 만들어내며 알고리즘 효율성과 하드웨어 활용 능력에서 강점을 입증하고 있다.","body":["=== 컴퓨팅 파워가 핵심 격차 ===","Liang Wenfeng은 중국이 국내외에서 활동하는 AI 연구 인력 면에서는 부족함이 없다고 평가했다. 문제는 주요 미국 기업들과 비교했을 때 컴퓨팅 파워가 턱없이 부족하다는 점이다. 그는 '스케일링을 막는 것은 의지가 아니라 불충분한 컴퓨팅 파워'라고 직접 언급했다.","DeepSeek은 더 적은 자원으로도 미국 모델에 근접한 성능을 끌어내며 알고리즘 효율성과 하드웨어 활용 최적화 능력을 증명했다. Liang은 향후 AI 경쟁의 축이 순수 모델 성능에서 비용, 개발 속도, 사용자 경험으로 이동할 것으로 내다봤다.","=== Nvidia 의존 탈피와 국산 칩의 가능성 ===","미국의 고성능 Nvidia 프로세서 수출 제한이 중국의 대안 칩 탐색을 가속화하고 있다. Liang은 Nvidia의 CUDA 생태계가 여전히 강력하지만, AI 지원 소프트웨어와 컴파일러 개발이 경쟁 플랫폼의 부상을 앞당길 수 있다고 분석했다.","그는 중국산 AI 칩의 가장 큰 장벽은 하드웨어나 소프트웨어 호환성이 아니라 생산 용량 부족이라고 강조했다. '국산 AI 칩에는 근본적인 하드웨어나 생태계 문제가 없다. 유일한 문제는 부족한 생산 용량'이라고 밝혔다.","DeepSeek은 현재도 Nvidia GPU로 학습을 진행하지만 CUDA 의존도를 낮춰가고 있다. DeepSeek V3에서는 자체 개발한 TileLang 컴파일러와 인하우스 소프트웨어 툴체인을 도입했다.","=== Huawei Ascend의 부상과 중국의 경쟁 전략 ===","Liang은 Huawei의 Ascend 프로세서와 SuperPoD 시스템이 성능과 비용 면에서 Nvidia와 점점 경쟁할 수 있는 수준이 됐다고 평가했다. Huawei의 AI 플랫폼은 실용적 수준으로 성숙했지만 공급은 여전히 제한적이며, 실질적인 생산 용량 개선까지는 5년이 걸릴 수 있다고 전망했다.","중국의 강점은 제조, 전력, 비용 통제에 있는 반면, 미국은 첨단 칩 설계와 소프트웨어 생태계에서 우위를 유지하고 있다. 따라서 중국 기업들은 저비용 AI 서비스를 앞세워 경쟁하는 전략이 유효하다는 것이 그의 분석이다.","=== AGI 로드맵: 추론→에이전트→지속학습 ===","DeepSeek의 최우선 목표는 단기 제품 확장이 아닌 AGI다. Liang이 제시한 로드맵은 지난해 chain-of-thought 추론, 올해 에이전트, 내년 지속 학습(continual learning)으로 이어진다.","현재 모델들은 복잡한 작업을 수행할 수 있지만 인간처럼 경험을 축적하지는 못한다. Liang은 지속 학습이 더 많은 인간의 업무를 대체하고 더 강력한 AI를 개발하는 열쇠라고 봤다. 근기간 우선순위로는 코딩 에이전트를 꼽았으며, 금융·헬스케어 등 특화 에이전트보다 범용 에이전트를 더 중요하게 평가했다. 3D 생성, 영상 생성, 월드 모델은 현재 핵심 투자 대상이 아니라고 밝혔다.","=== 오픈소스·상업적 자제…IPO는 목표 아냐 ===","Liang은 DeepSeek이 수익 극대화나 상장 준비가 아닌 '유용한 AI 추구'를 위해 설립됐다고 강조하며, 오픈소스가 이 미션의 핵심이라고 말했다. Sina에 따르면 그는 '독점할 수 없다. 남과 공유하지 않으면 살아남지 못한다'고 언급했다.","DeepSeek은 내부에서 사용하는 것과 동일한 모델을 외부에 공개하며, 경쟁사가 이를 활용하는 것에 개의치 않는다. 프론티어 모델 연구를 지속할 수 있는 기업은 많지 않기 때문이다. 회사는 수요가 용량을 초과했을 때 가격을 올렸다가 이후 이전 수준의 4분의 1로 낮춘 바 있으며, Liang은 이러한 가격 인하가 단순한 가격 전략이 아니라 아키텍처 효율성을 반영한 것이라고 설명했다.","DeepSeek은 차세대 ByteDance나 Tencent가 되는 것을 목표로 삼지 않는다. 소비자 트래픽과 기업 매출은 AGI 연구 다음이다. Liang은 중국의 파운데이션 모델 시장이 너무 많은 개발자들로 분산돼 있어 향후 통합이 불가피하다고 전망했다. DeepSeek의 전략은 컴퓨팅 효율 향상, 오픈소스 배포, 상업적 자제라는 세 가지 베팅 위에 세워져 있다."],"image":"https://img.digitimes.com/newsshow/20260723vl224_files/2_b.jpg","imageCaption":"","author":"","date":"JUL 24, 2026","time":"06:27","url":"https://www.digitimes.com/news/a20260723VL224/deepseek-ai-chips-nvidia-software-efficiency.html","readTime":"3분","credibility":null,"isNew":true},{"id":"13","source":"DIGITIMES","sourceName":"DIGITIMES","sourceDate":"JUL 24, 2026","sourceUrl":"https://www.digitimes.com/news/a20260722VL205/demand-smartphone-pc-sales-xiaomi.html","category":"테크","tag":"산업 분석","title":"AI 메모리 쇼크, 스마트폰·PC 시장 승자와 패자를 가르다","titleEn":"AI memory crunch hits smartphones and PCs, splitting winners from losers","deck":"AI 수요로 LPDDR5X·UFS 가격이 폭등하면서 중저가 스마트폰 제조사는 직격탄을 맞고 있다. Samsung과 Apple은 오히려 점유율을 확대하며 격차를 벌리고 있다.","lede":"AI 서버 수요가 메모리 공급을 빨아들이면서 스마트폰과 PC용 메모리 가격이 사상 유례없는 속도로 치솟고 있다. 2026년 상반기 모바일 LPDDR4X·LPDDR5X 가격은 130% 이상, eMMC·UFS 스토리지는 160% 이상 올랐다. 이 충격은 중저가 시장에 집중적으로 쏠리며 Xiaomi, Oppo, Vivo 등의 출하량을 끌어내린 반면, Samsung과 Apple은 프리미엄 수요에 힘입어 사상 최고 점유율을 기록했다. 메모리 가격 상승세가 다소 둔화되고 있지만, 저가 재고가 소진되면 추가 가격 인상은 불가피하다는 전망이다.","body":["=== 메모리 가격 폭등, 공급망 구조가 바뀌다 ===","메모리 공급사들이 서버·AI 애플리케이션 쪽으로 생산 능력을 대거 돌리면서 소비자용 메모리 공급이 급격히 타이트해졌다. 공급망 추산에 따르면 2026년 상반기 모바일 LPDDR4X·LPDDR5X 가격은 130% 이상 상승했고, eMMC와 UFS 스토리지는 160% 이상 뛰었다. IDC는 전년 대비 메모리 비용 상승률이 약 300%에 달하며, 일부 저가 스마트폰에서 메모리가 부품 원가의 65% 이상을 차지하게 됐다고 추정했다.","최근 들어 가격 상승 속도는 다소 완화됐고, 스마트폰 제조사들의 시장 전망도 '극도로 비관적'에서 '비관적' 수준으로 한 단계 나아졌다. 그러나 저가에 매입한 재고가 소진된 이후에는 비싼 메모리가 신제품 원가에 고스란히 반영될 수밖에 없어 압박은 여전히 지속될 전망이다.","=== Xiaomi·Oppo·Vivo, 출하량 급감 ===","중저가 스마트폰 비중이 높은 Xiaomi, Oppo, Vivo, Transsion은 이번 충격에 가장 직접적으로 노출돼 있다. 얇은 마진 구조상 높아진 메모리 비용을 자체 흡수할 여력이 거의 없기 때문이다.","Counterpoint Research에 따르면 Xiaomi, Oppo, Vivo는 2분기에 각각 두 자릿수 출하량 감소를 기록했다. Nikkei가 IDC 데이터를 인용한 보도에서는 세 회사의 4~6월 합산 출하량이 전년 동기 대비 22% 감소한 8,120만 대로 집계됐다. Xiaomi는 26% 급감한 3,120만 대, Oppo는 17% 줄어든 2,880만 대, Vivo는 19% 감소한 2,120만 대를 기록했다.","제조사들은 스펙 다운그레이드로 비용 상승에 대응하고 있다. 8GB 모델을 6GB로, 6GB 모델을 4GB로 낮추는 방식이다. 그러나 중간급·프리미엄 라인은 스펙을 낮출 경우 수요가 꺾이는 부작용이 있어, 결국 소비자 가격 인상을 피하기 어려운 상황이다.","=== Samsung·Apple, 점유율 사상 최고 경신 ===","반면 Samsung과 Apple은 프리미엄 수요에 힘입어 격차를 더욱 벌렸다. Samsung은 2분기 글로벌 시장 점유율 24%로 1위를 탈환했고, 출하량은 8% 증가한 6,270만 대를 기록했다. Apple의 iPhone 출하량은 15% 늘어난 5,580만 대로 2분기 사상 최고치를 경신했으며, 분기 점유율도 역대 최고인 20%에 달했다.","중국 시장에서도 양극화가 뚜렷하다. Xiaomi의 중국 내 점유율은 16%에서 13%로, Oppo와 Vivo는 각각 18%에서 16%로 하락했다. 반면 Huawei는 Enjoy 90 Pro Max와 Pura X Max 폴더블에 대한 관심에 힘입어 2020년 4분기 이후 최고 수준인 23%로 올라섰고, Apple도 15%에서 18%로 점유율을 높였다. 글로벌 스마트폰 출하량은 7% 감소한 2억 7,750만 대로 2분기 연속 역성장을 기록했으며, 업계는 2026년 연간 출하량이 약 12% 감소해 10억 대 수준에 그칠 것으로 예상하고 있다.","=== Xiaomi의 목표치 조정, 회복 신호인가 ===","Xiaomi가 2026년 스마트폰 출하 목표를 약 9,000만 대에서 1억 1,000만 대로 상향했다는 보도가 나오면서 메모리 상황이 개선되는 것 아니냐는 관측이 나왔다. 추가되는 물량의 상당 부분은 가성비 모델에서 나올 것으로 예상된다.","그러나 공급망 소식통들은 이번 조정이 진정한 회복세보다는 과거 과도한 하향 수정의 교정에 가깝다고 본다. Xiaomi는 애초 2025년 실적과 유사한 약 1억 7,000만 대를 목표로 했다가 1월에 1억 3,500만 대로 낮추고, 6월에 다시 하향 조정했다. 최근 상향된 목표치도 전년 대비 약 35% 낮은 수준에 불과하다.","Oppo와 Vivo는 Samsung Electronics의 3분기 메모리 공급 가격 인상 제안을 거절한 것으로 알려졌다. 하지만 공급자 우위 시장에서 높은 가격을 거부하는 것은 협상력 확보가 아닌 부품 구매량 축소를 의미한다. 재고도 아직 소진되지 않아 하반기 성수기를 앞두고도 공격적인 재고 확충 유인이 없는 상황이다.","=== PC 시장도 충격…중고 메모리 수요 급증 ===","같은 메모리 충격이 중국 PC 시장에도 번지고 있다. Chinastarmarket.cn에 따르면 선전 화창베이(Huaqiangbei) 전자상가 상인들은 기존에 CNY300(약 US$44.3)에 팔리던 메모리 모듈이 지금은 CNY1,000에 거래된다고 전했다. 한 도매상은 이를 10년 이상 경험 중 가장 가파른 상승이라고 표현했다.","높은 가격 탓에 중고 DDR4·DDR5 모듈 수요도 늘고 있다. 소비자들이 구형 PC에서 메모리를 빼내 팔고, 그 돈으로 새 시스템을 구성하는 방식이다. Apple, Huawei, Xiaomi 모두 노트북 가격을 인상했으며 특히 폭이 컸다. Apple 화창베이 플래그십 매장 직원에 따르면 MacBook Neo, MacBook Air, MacBook Pro 구성 가격이 프로모션 조정 후 각각 약 CNY500, CNY1,500, CNY3,000씩 올랐다.","Huawei의 Windows 노트북은 플래그십 매장에서 일시 품절 상태였고, HarmonyOS 모델은 최대 CNY20,000에 판매 중이다. Xiaomi 노트북도 소폭 인상돼 보급형 모델이 약 CNY6,000 수준이다. Elecfans의 한 커뮤니티 회원은 전년도 6·18 쇼핑 페스티벌에서 CNY14,000에 조립한 고사양 게이밍 PC를 최근 같은 가격에 되팔았다고 전했다. 친구의 PC 조립을 도울 때는 현재 스토리지 가격이 너무 높아 2TB 기계식 하드드라이브를 재사용했다고 밝혔다."],"image":"https://img.digitimes.com/newsshow/20260722vl205_files/2_2b.jpg","imageCaption":"","author":"","date":"JUL 24, 2026","time":"06:20","url":"https://www.digitimes.com/news/a20260722VL205/demand-smartphone-pc-sales-xiaomi.html","readTime":"4분","credibility":null,"isNew":true},{"id":"14","source":"TrendForce","sourceName":"TrendForce","sourceDate":"JUL 23, 2026","sourceUrl":"https://www.trendforce.com/news/2026/07/23/news-intel-amd-reportedly-sign-long-term-server-cpu-deals-with-chinese-customers-amid-tight-supply/","category":"테크","tag":"산업 분석","title":"Intel·AMD, 中 고객과 서버 CPU 장기 공급 계약 체결","titleEn":"Intel, AMD Reportedly Sign Long-Term Server CPU Deals with Chinese Customers Amid Tight Supply","deck":"AI 데이터센터 확장으로 서버 CPU 공급이 빠듯해지면서, Intel과 AMD가 중국 고객사와 장기 구매 계약을 맺고 있다. 일부 제품 가격은 연초 대비 40% 이상 급등했다.","lede":"AI 데이터센터 수요 급증으로 서버 CPU 시장에 이상 기류가 감지되고 있다. Reuters에 따르면, Intel과 AMD는 중국 고객사들과 1~2년 이상의 장기 서버 CPU 구매 계약을 잇따라 체결하고 있으며, 일부 제품 가격은 연초 대비 40% 넘게 올랐다. AI 가속기나 메모리 반도체에 비해 상대적으로 수급이 여유롭다고 여겨졌던 서버 CPU 시장이 이제 공급 부족 국면에 접어들고 있다는 분석이다. 중국 클라우드 업체들과 인터넷 기업들의 인프라 구축 속도에도 영향을 미칠 수 있다는 우려가 나온다.","body":["=== 장기 계약 확산, 시장 패러다임 변화 ===","Reuters는 소식통을 인용해 Intel과 AMD가 중국 고객사들과 서버 CPU 장기 공급 계약을 체결하고 있다고 보도했다. 해당 계약은 가격보다는 구매 물량을 고정하는 방식이 일반적이며, 계약 기간은 보통 1년이 표준이지만 일부는 2년 이상으로 연장되는 사례도 있다.","Reuters는 이번 움직임이 서버 CPU 시장의 구조적 전환을 보여주는 신호라고 짚었다. 과거에는 AI 가속기나 메모리 반도체에 비해 서버 CPU를 구하기가 상대적으로 쉬웠지만, 공급이 빠듯해지면서 중국 클라우드 업체와 인터넷 기업들의 AI 인프라 구축 속도가 느려지고 비용이 높아질 수 있다. AI 수요에 따른 공급 부족으로 고객사들이 장기 공급 계약에 나선 메모리 시장의 흐름과도 닮아 있다.","=== 가격 급등세, 연초 대비 최대 40% 상승 ===","공급 부족은 이미 가격에 반영되고 있다. Reuters에 따르면 중국 내 서버 CPU 가격은 계속 오르고 있으며, 일부 제품은 전월 대비 10%를 넘는 가격 상승을 기록했다. 특정 CPU 가격은 연초 이후 40% 이상 상승한 것으로 전해졌다.","앞서 올해 2월, Reuters는 Intel과 AMD가 중국 고객사들에 서버 CPU 공급 부족을 경고했다고 보도한 바 있다. Intel은 당시 납품 리드타임이 최대 6개월까지 길어질 수 있다고 밝혔다.","=== 공급자 우위 시장, Agentic AI가 CPU 수요 견인 ===","서울경제신문이 인용한 애널리스트들은 공급업체들이 협상력을 높이면서 구매 물량을 미리 확보하는 장기 계약을 제시할 수 있게 됐다고 분석했다. 여기에 Agentic AI의 부상도 CPU 수요를 끌어올리는 요인으로 작용하고 있다. 데이터베이스 검색, 문서 생성 등의 작업에 CPU가 점점 더 많이 활용되고 있기 때문이다.","=== 중국, 미국 GPU 수출 규제 속 CPU 의존도 심화 ===","서울경제신문은 중국이 대규모 AI 데이터센터 구축을 추진하는 만큼 CPU 가격 상승에 특히 취약하다고 지적했다. 중국은 미국의 첨단 AI GPU 수출 제한을 보완하기 위해 CPU 인프라에 크게 의존하고 있기 때문이다.","Reuters에 따르면 중국은 데이터센터 랙 확장, AI 컴퓨팅 클러스터, 국가 컴퓨팅 인프라 구축을 바탕으로 세계 최대 서버 시장 중 하나다. 이러한 대규모 구축 수요가 Intel과 AMD 프로세서에 대한 압박을 가중시키고 있다. Intel에게 중국은 전체 매출의 20% 이상을 차지하는 핵심 시장이며, Alibaba와 Tencent 같은 주요 클라우드 업체들도 Intel·AMD의 중국 고객사에 포함된다.","=== ByteDance 등 자체 CPU 개발 박차 ===","한편, 중국 주요 클라우드 기업들은 자체 CPU 개발에도 적극 나서고 있다. South China Morning Post는 소식통을 인용해, ByteDance가 늦어도 내년 초까지 차세대 자체 개발 CPU 설계를 완료하고 2027년 하반기에 양산 및 본격 배포를 계획하고 있다고 전했다."],"image":"","imageCaption":"","author":"","date":"JUL 23, 2026","time":"00:00","url":"https://www.trendforce.com/news/2026/07/23/news-intel-amd-reportedly-sign-long-term-server-cpu-deals-with-chinese-customers-amid-tight-supply/","readTime":"3분","credibility":null,"isNew":true},{"id":"15","source":"OLED-Info","sourceName":"OLED-Info","sourceDate":"2026-07-26T08:05:30+0300","sourceUrl":"https://www.oled-info.com/three-lgd-employees-sentenced-jail-after-found-guilty-transferring-confidential","category":"디스플레이","tag":"산업 분석","title":"LG Display 전직 직원 3명, OLED 기술 중국 유출로 실형 선고","titleEn":"Three LGD employees sentenced to jail after found guilty of transferring confidential information to a Chinese company","deck":"서울중앙지법이 산업기술보호법 위반 혐의를 받은 LG Display 전직 직원 3명에게 징역형을 선고했다. OLED 수율 개선 기술과 원가 정보 등이 중국 기업으로 유출된 것으로 확인됐다.","lede":"서울중앙지방법원이 OLED 핵심 기술을 중국 기업에 유출한 혐의로 기소된 LG Display 전직 직원 3명에게 실형을 선고했다. 이들은 20년 이상 LG Display에 재직하며 WOLED 공장의 설계 도면을 촬영하고 수율 관련 기술을 빼돌린 것으로 드러났다. 이번 판결은 한국과 중국 디스플레이 업계 간 기술 패권 다툼이 법정으로 이어지는 흐름 속에서 나온 것으로, OLED 기술 보안을 둘러싼 업계의 긴장감을 다시 한번 고조시키고 있다.","body":["=== 법원 판결 내용 ===","서울중앙지방법원은 산업기술보호법 위반 혐의로 기소된 LG Display 전직 직원 3명에게 각각 다른 형량을 선고했다. 가장 무거운 형량은 징역 5년에 벌금 약 3,600만 원(미화 2만 7,000달러)이며, 두 번째 피고인은 징역 2년에 벌금 약 950만 원(미화 7,000달러), 세 번째 피고인은 징역 1년을 선고받았다.","경찰에 따르면 이들은 LG Display에서 수년간, 그 중 두 명은 20년 이상 근무한 뒤 퇴사해 미공개 중국 기업에 입사했다. 재직 중에 기술을 절취했으며, 중국 광저우에 위치한 LG Display의 WOLED 생산 공장 설계 도면을 사진으로 찍어 유출한 것으로 조사됐다.","=== 유출된 기술의 성격 ===","유출된 기술은 불량률을 낮추고 수율을 개선하는 데 활용되는 핵심 공정 기술로 알려졌다. 이와 함께 LG Display의 원가 관련 정보도 함께 유출된 것으로 전해진다. 이는 경쟁사가 생산 비용 구조까지 파악할 수 있게 하는 민감한 정보로 업계에서는 심각하게 받아들이고 있다.","=== BOE의 WOLED 개발 현황과의 연관성 ===","이번 사건과 관련해 중국의 대형 디스플레이 업체 BOE가 주목받고 있다. BOE는 자체 WOLED 생산 공정을 개발 중이며 파일럿 생산 라인을 운영하고 있다. 2026년 5월에는 난징 소재 B18 8.5세대 LCD 공장 일부를 WOLED 생산 라인으로 전환하는 계획이 알려지기도 했다.","그러나 최근 업계 보고서에 따르면 BOE는 중국 당국으로부터 해당 사업 승인을 받지 못한 것으로 전해진다. 대규모 투자가 필요한 대형 WOLED 생산 라인의 수익성에 의문이 제기된 데다, BOE 내부에서도 이 프로젝트를 둘러싼 갈등이 있다는 보도도 있다. 다만 이번 기술 유출 사건의 수사 대상이 된 중국 기업이 BOE인지, 아니면 다른 디스플레이 업체인지는 현재까지 확인되지 않았다.","=== 한·중 OLED 기술 분쟁의 역사 ===","한국과 중국 디스플레이 업체 간 OLED 기술 분쟁은 어제오늘 일이 아니다. 최근에는 LG Display와 Tianma가 오랫동안 이어온 LCD·OLED 디스플레이 글로벌 특허 분쟁을 합의로 마무리했으며, 지난해에는 Samsung Display와 BOE도 장기간의 지식재산권 분쟁을 종식하고 BOE가 Samsung의 특허에 대한 로열티를 지급하기로 합의했다.","2025년에는 서울경찰청 산업기술보안수사팀이 Samsung Display 직원들을 대상으로 OLED 기술 유출 의혹 수사에 착수했다. 경찰은 10월 1일 Samsung Display 아산 캠퍼스에 대한 압수수색을 실시했으며, 2025년 상반기에만 총 8건의 기술 유출 사건을 입건했고 이 중 5건이 중국과 연관된 것으로 파악됐다. 또한 2025년 10월에는 LG Display에서도 핵심 기술이 중국 기업으로 유출된 정황이 포착돼 경찰이 수사에 나섰다.","=== 과거 주요 기술 유출 사례 ===","OLED 업계의 기술 유출 사례는 2010년대부터 꾸준히 이어져 왔다. 2021년에는 Samsung Display 연구원 2명이 OLED 기술을 외부 업체에 넘긴 혐의로 징역 2년형을 선고받았다. 이 사건의 주요 관계자 중 한 명은 기소 후 한국을 떠났다가 자진 귀국해 체포됐으며, 2018년부터 2020년 사이에 OLED ELA(Excimer Laser Annealing) 및 잉크젯 프린팅 공정에 사용되는 OCR 기술을 중국 기업에 판매하려 했던 것으로 검찰은 밝혔다. 검찰이 산정한 해당 영업비밀의 가치는 최소 미화 2억 5,000만 달러에 달한다.","2018년에는 Samsung Electronics 협력사인 Toptec 임직원 11명이 Samsung의 플렉시블 OLED 기술을 BOE와 CSoT 등 중국 업체에 유출한 혐의로 기소됐다. 같은 해 6월에는 한국과 중국 연구원, 그리고 한 국립 연구기관 교수를 포함한 여러 관계자가 Samsung의 OLED 기술 유출 혐의로 기소됐다. 2012년에는 이스라엘 기업 Orbotech의 한국 지사 직원들이 LG Display와 Samsung Display의 OLED 기술을 중국 및 대만 기업에 넘긴 혐의를 받기도 했다.","Samsung과 LG 간의 기술 분쟁도 오랫동안 지속됐다. 2013년 경찰은 LG Display의 대형 OLED TV 기술을 절취한 혐의로 Samsung Display 사무실을 압수수색했으며, 같은 해 두 회사는 법원 밖에서 분쟁을 해결하기로 합의했다. 이후 2015년에 이르러서야 양사는 모든 법적 분쟁을 마무리했고, 현재는 Samsung이 일부 TV 제품에 LG Display의 WOLED 패널을 채택하는 협력 관계로 발전했다."],"image":"https://www.oled-info.com/sites/default/files/inline-images/LG-Display-corporate-image.jpg","imageCaption":"","author":"","date":"2026-07-26T08:05:30+0300","time":"","url":"https://www.oled-info.com/three-lgd-employees-sentenced-jail-after-found-guilty-transferring-confidential","readTime":"3분","credibility":null,"isNew":true},{"id":"16","source":"OLED-Info","sourceName":"OLED-Info","sourceDate":"2026-07-25T08:31:37+0300","sourceUrl":"https://www.oled-info.com/sfc-progresses-its-ipo-plans-reveals-its-financial-results-2025","category":"디스플레이","tag":"산업 분석","title":"SFC, KOSPI 상장 추진…2025년 매출 1,100억원 공개","titleEn":"SFC progresses with its IPO plans, reveals its financial results for 2025","deck":"OLED 소재 기업 Sun Fine Chem(SFC)이 한국거래소에 상장 예비심사를 신청하며 IPO에 본격 시동을 걸었다. 2025년 매출 1억 1,000만 달러, 순이익 1,470만 달러를 기록했다.","lede":"OLED 소재 전문 기업 Sun Fine Chem(SFC)이 한국 KOSPI 상장을 향한 절차를 본격화했다. 한국거래소는 SFC로부터 상장 예비심사 신청서를 접수했다고 밝혔으며, 실제 IPO까지는 수개월이 소요될 전망이다. SFC는 심사 신청과 함께 2025년 재무 실적을 공개했으며, SK Materials JNC(SKMJ), LG Chem과의 특허 분쟁도 현재진행형이다.","body":["=== IPO 추진 배경 및 재무 실적 ===","Hodogaya Chemical의 자회사인 SFC는 OLED 소재, 유기 TFT, PDP 디스플레이 등 다양한 소자용 재료를 개발하는 한국 기반 기업이다. 2025년 11월 IPO 계획이 처음 알려진 이후, SFC는 한국거래소(KOSPI)에 상장 예비심사 신청서를 제출하며 절차를 본격화했다.","이번 신청은 IPO의 첫 단계로, 실제 상장까지는 수개월이 걸릴 것으로 보인다. SFC는 신청 과정에서 2025년 연간 매출 1억 1,000만 달러(약 1,100억 원), 순이익 1,470만 달러(약 147억 원)의 재무 성과를 공개했다.","=== SK Materials JNC와의 특허 분쟁 ===","SFC는 최근 OLED 소재 관련 특허 분쟁으로 주목을 받아왔다. 2026년 4월, 한국 대법원은 SFC의 청색 OLED 발광체 특허(한국 특허 ID: 2094830)가 유효하다고 최종 판결하며 SK Materials JNC(SKMJ)의 무효 주장을 받아들이지 않았다.","이어 한 달 뒤 SFC는 SKMJ를 상대로 한 민사소송에서도 승소해 1억 원(약 6만 5,000달러)의 손해배상금과 소송 비용 전액을 지급받게 됐다. SFC는 해당 소재에 대한 SKMJ의 판매 금지도 요청했으며, 이 역시 법원 결정에 포함된 것으로 알려졌다. 이 특허는 'Polycyclic aromatic compound and organoelectroluminescent device using the same'이라는 제목으로, 형광 청색 OLED 발광체의 재료 구조를 상세히 기술하고 있다. 분쟁의 발단은 2020년 SKMJ가 제기한 특허 무효 심판으로 거슬러 올라가며, 2024년 여름 특허법원이 유효 판결을 내린 뒤 SKMJ가 대법원에 상고한 바 있다.","=== LG Chem과의 특허 공방 ===","반면 LG Chem과의 분쟁에서는 SFC가 패소했다. 2026년 5월, 한국 대법원은 SFC와 Idemitsu Kosan이 공동으로 제기한 LG Chem의 중수소화(deuterated) OLED 소재 관련 특허 소송을 최종 기각했다. 법원은 LG Chem의 소재가 기존 기술과 실질적으로 동일하지 않으며 독자적인 발명성을 갖추고 있다고 판단했다.","SFC와 Idemitsu는 LG Chem이 기존 솔루션의 중수소화율 36%에서 40%로 높인 것에 불과하다고 주장했으나, 법원은 그 외에도 상당한 기술적 성과가 있었다고 봤다. 또한 LG Chem이 중수소화 소재를 OLED 스택 응용에 최초로 도입해 '예측하기 어려운' 수준의 성능 향상을 이끌어냈다는 점도 판결에 영향을 미쳤다. 해당 특허는 2019년 DuPont으로부터 취득한 것이다.","같은 달, LG Chem은 역으로 SFC를 상대로 청색 OLED 호스트 소재 생산 관련 특허 침해 소송을 제기했다. 이 특허 역시 2019년 DuPont으로부터 취득한 것으로, 관련 판결은 2026년 여름 중 나올 것으로 예상된다."],"image":"https://www.oled-info.com/sites/default/files/inline-images/SFC-logo_0.jpg","imageCaption":"","author":"","date":"2026-07-25T08:31:37+0300","time":"","url":"https://www.oled-info.com/sfc-progresses-its-ipo-plans-reveals-its-financial-results-2025","readTime":"3분","credibility":null,"isNew":true},{"id":"17","source":"OLED-Info","sourceName":"OLED-Info","sourceDate":"2026-07-24T15:35:38+0300","sourceUrl":"https://www.oled-info.com/apple-and-other-smartphone-makers-pressure-oled-producers-reduce-costs-some","category":"디스플레이","tag":"산업 분석","title":"Apple, Samsung·LG Display에 OLED 패널 20% 가격 인하 압박","titleEn":"Apple and other smartphone makers pressure OLED producers to reduce costs, some look into utilizing lower-resolution panels","deck":"부품 원가 상승 속에 Apple이 iPhone 18 Pro 시리즈용 AMOLED 패널 가격을 20% 낮출 것을 Samsung Display와 LG Display에 요구했다. 다른 스마트폰 제조사들도 저해상도 패널 전환을 검토 중이다.","lede":"메모리와 칩 가격이 잇따라 오르면서 스마트폰 제조사들의 원가 압박이 커지고 있다. 그 불똥이 OLED 디스플레이 업계로 튀었다. Apple은 2026년 플래그십 모델인 iPhone 18 Pro 시리즈의 AMOLED 패널 가격을 20% 인하해 달라고 Samsung Display와 LG Display에 요구한 것으로 알려졌다. 동시에 중저가 스마트폰 시장에서는 저해상도 flexible AMOLED로의 전환 움직임이 가속화되고 있다.","body":["=== 부품 가격 줄인상, 디스플레이로 번진 압박 ===","메모리 가격은 이미 오랜 기간 높은 수준을 유지해 왔다. 여기에 Qualcomm이 전날 자사 칩 가격을 두 자릿수 인상한다고 발표하면서 스마트폰 제조사들의 원가 부담이 한층 가중됐다. 이에 따라 제조사들은 디스플레이 등 다른 부품에서 비용을 절감하는 방향으로 눈을 돌리고 있다.","=== Apple의 협상 카드: 20% 가격 인하 요구 ===","업계 보고서에 따르면 Apple은 2026년 기기의 OLED 패널 독점 공급사인 Samsung Display와 LG Display에 접촉해 iPhone 18 Pro 및 iPhone 18 Pro Max용 AMOLED 디스플레이 가격을 20% 낮출 것을 요구했다. Apple이 목표로 하는 iPhone 18 Pro Max AMOLED 패널의 단가는 70달러이며, 협상 결과에 따라 Samsung과 LG로부터 66.5달러까지 낮출 수 있을 것으로 전해진다. 이는 2025년 iPhone 17 Pro Max에 지불한 가격 대비 20% 할인된 수준이다.","한편 iPhone 18 Pro용 AMOLED 패널은 이전 모델보다 성능이 향상된 신형 OLED 스택을 적용할 예정이며, Samsung의 M16 OLED 스택이 채택될 것으로 알려졌다.","=== Samsung·LG, 할인 수용 가능성 높아 ===","Samsung Display와 LG Display가 Apple의 요구를 수용할 가능성은 높다는 분석이다. 두 한국 기업 모두 Apple의 독점 AMOLED 공급 지위를 지키고, 중국 경쟁사의 추격을 막아야 하는 유인이 강하기 때문이다. 전날 LG Display가 모바일 AMOLED 생산 역량 강화를 위한 강력한 정부 지원을 확보했다고 발표한 것도 이 같은 맥락에서 해석된다.","iPhone 18 Pro 시리즈는 대규모 출하량이 예상돼 Samsung과 LG 모두 충분한 이익을 확보할 수 있다는 점도 협상 수용의 배경으로 꼽힌다. Apple만큼 단일 모델의 물량을 보장할 수 있는 제조사는 사실상 없다는 점에서, Apple의 협상력은 독보적이라는 평가가 나온다.","=== 중저가 시장, 저해상도 flexible AMOLED로 전환 ===","Apple 이외의 스마트폰 브랜드들도 OLED 패널 비용 절감을 모색하고 있지만, Apple과 같은 협상력은 갖추지 못했다. Sigmaintell에 따르면 여러 스마트폰 제조사들이 중저가 라인업에서 저해상도 flexible AMOLED 패널로 전환하는 방안을 검토 중이다. 저해상도 OLED를 채택하면 패널 단가 절감은 물론, 스마트폰 SoC와 메모리 사양 요구치도 함께 낮출 수 있어 시스템 설계 전반의 비용 절감 효과를 기대할 수 있다. 카메라 해상도를 낮추는 방향도 같은 맥락에서 논의되고 있다.","=== 스마트폰 시장 위축, 중국 OLED 공장 가동률 70% 이하로 ===","Sigmaintell은 2026년 전체 스마트폰 시장이 전년 대비 3.3% 감소해 약 10억 2,640만 대 수준에 그칠 것으로 전망했다. 중국 내 flexible OLED 공장의 평균 가동률은 70% 아래로 떨어진 상태로, OLED 제조사들이 가격 인하나 보급형 패널 생산 확대 압박을 받고 있다. 다만 Samsung Display와 LG Display는 프리미엄 시장에 집중하고 있어 상대적으로 영향이 제한적이다. 단, Samsung의 rigid(유리 기판) AMOLED는 중국산 저가 flexible OLED의 대체 압박을 받고 있는 것으로 분석된다."],"image":"https://www.oled-info.com/sites/default/files/inline-images/Apple-2024-2026-flagship-AMOLED-prices-estimate.png","imageCaption":"","author":"","date":"2026-07-24T15:35:38+0300","time":"","url":"https://www.oled-info.com/apple-and-other-smartphone-makers-pressure-oled-producers-reduce-costs-some","readTime":"3분","credibility":null,"isNew":true},{"id":"18","source":"OLED-Info","sourceName":"OLED-Info","sourceDate":"2026-07-24T14:00:00+0300","sourceUrl":"https://www.oled-info.com/volvos-new-ex60-midsize-electric-suv-sports-15-amoled-central-display","category":"디스플레이","tag":"산업 분석","title":"Volvo 신형 EX60, 15인치 AMOLED 센터 디스플레이 탑재","titleEn":"Volvo's new EX60 midsize electric SUV sports a 15\" AMOLED central display","deck":"Volvo가 SPA3 플랫폼 기반의 중형 전기 SUV EX60을 공개했다. 15인치 AMOLED 중앙 터치스크린과 530km 최장 주행거리를 갖췄다.","lede":"Volvo가 새로운 중형 전기 SUV EX60을 출시하며 자사 최초의 SPA3 플랫폼 기반 차량임을 강조했다. EX60은 Volvo 라인업 중 최장인 530km의 주행거리와 10분 충전으로 260km를 추가하는 초고속 충전 기능을 갖췄다. 인테리어 핵심인 15인치 AMOLED 중앙 디스플레이는 차량 내 디스플레이 기술의 프리미엄화 흐름을 반영한다. 미국을 포함한 여러 국가에서 곧 인도가 시작될 예정이며, 시작 가격은 $58,400이다.","body":["=== Volvo 첫 SPA3 플랫폼 전기 SUV ===","Volvo가 중형 전기 SUV EX60을 공식 출시했다. EX60은 Volvo가 새롭게 개발한 SPA3 플랫폼을 처음으로 적용한 모델로, 전동화 전략의 새로운 이정표가 된다.","주행거리는 530km로 Volvo 전기차 라인업 중 최장이며, 초고속 충전 기술을 통해 단 10분 만에 260km를 추가할 수 있다. 이는 경쟁 차급 대비 높은 실용성을 제공한다는 평가다.","=== 15인치 AMOLED 중앙 디스플레이 ===","EX60의 실내에는 15인치 AMOLED 중앙 터치스크린이 탑재됐다. AMOLED 패널은 높은 명암비와 풍부한 색재현율을 바탕으로 차량용 디스플레이의 프리미엄 표준으로 자리 잡아가고 있으며, Volvo는 이를 통해 인포테인먼트 경험을 한층 끌어올렸다.","=== 가격 및 출시 일정 ===","Volvo는 미국을 포함한 복수의 국가에서 EX60 인도를 곧 시작할 예정이라고 밝혔다. 시작 가격은 $58,400으로 책정됐다."],"image":"https://www.oled-info.com/sites/default/files/styles/large/public/2026-07/Volvo-EX60-OLED.jpg?itok=AqF6Eo2i","imageCaption":"","author":"","date":"2026-07-24T14:00:00+0300","time":"","url":"https://www.oled-info.com/volvos-new-ex60-midsize-electric-suv-sports-15-amoled-central-display","readTime":"1분","credibility":null,"isNew":true},{"id":"19","source":"OLED-Info","sourceName":"OLED-Info","sourceDate":"2026-07-24T13:52:20+0300","sourceUrl":"https://www.oled-info.com/solus-advanced-materials-reports-15-decrease-oled-material-sales-q2-2026","category":"디스플레이","tag":"산업 분석","title":"Solus Advanced Materials, 2Q26 OLED 소재 매출 15% 감소","titleEn":"Solus Advanced Materials reports a 15% decrease in OLED material sales in Q2 2026","deck":"Solus Advanced Materials가 2026년 2분기 실적을 발표했다. 전체 매출은 성장했지만 OLED 소재 부문은 전년 대비 15% 줄어든 1,840만 달러에 그쳤다.","lede":"한국 OLED 소재 전문기업 Solus Advanced Materials가 2026년 2분기 실적을 공개했다. 전체 매출은 7,000만 달러로 전년 동기 대비 31% 증가했으나, OLED 소재 사업부는 스마트폰 수요 둔화와 중국 고객사 일정 지연 등의 영향으로 15% 감소했다. 회사는 하반기 IT용 AMOLED 패널 소재 공급을 시작하며 실적 반등을 기대하고 있다.","body":["=== 2Q26 실적 개요 ===","Solus Advanced Materials는 2026년 2분기 매출 7,000만 달러를 기록했다. 이는 전년 동기 대비 31% 증가한 수치다. 그러나 영업손실은 1,460만 달러로, 전년보다 760만 달러 개선됐다.","배터리 포일(foil) 사업부는 2025년 이후 강한 성장세를 이어갔지만, OLED 사업부는 부진을 면치 못했다. OLED 소재 매출은 전년 대비 15% 감소한 1,840만 달러에 머물렀다.","=== OLED 부문 부진 원인 ===","Solus는 이번 OLED 매출 감소 원인으로 계절적 비수기, 스마트폰용 OLED 수요 약세, 중국 고객사의 일정 지연을 꼽았다. 다만 계절적 비수기는 2025년 2분기에도 동일하게 적용됐던 요인이라는 점에서, 구조적인 수요 둔화 가능성도 배제하기 어렵다.","=== 하반기 반등 전략: IT AMOLED 소재 공급 ===","Solus는 2026년 하반기 IT용 AMOLED 패널 소재 공급을 시작하면서 OLED 사업부 실적이 개선될 것으로 전망한다. 앞서 2026년 3월에는 익산(Iksan)에 신규 OLED 소재 생산 거점을 준공하고 양산에 돌입했다. 이 공장 가동으로 Solus의 OLED 소재 총 생산 능력은 기존 대비 두 배로 확대됐다.","=== 2025년 연간 실적 및 2026년 목표 ===","2025년 연간 기준으로 Solus는 매출 4억 2,000만 달러를 달성했다. 이는 2024년 대비 8% 증가한 수치다. 그러나 영업손실은 4,900만 달러에 달했으며, 주요 원인은 배터리용 동박(copper foil) 사업의 부진이었다. OLED 사업부 매출은 8,600만 달러로 2024년과 유사한 수준에 머물렀다. 회사는 2026년 OLED 매출을 10% 늘린 9,500만 달러로 끌어올리겠다는 목표를 제시했다.","=== 녹색 인광 호스트 소재 및 기술 로드맵 ===","Solus는 2025년 5월 자사의 녹색 인광(green phosphorescence) OLED 호스트 소재가 고객사 승인을 획득하고 양산 준비에 들어갔다고 발표했다. 이 소재는 수년간의 R&D 끝에 개발된 독자 기술로, 중수소(deuterium) 치환이 필요 없어 고성능과 가격 경쟁력을 동시에 갖춘 것이 특징이다. Solus는 다음 단계로 적색 인광(red phosphorescence) 소재 개발을 추진할 계획이다.","현재 Solus는 HTL, ETL, HBL, 녹색 호스트 소재, CPL 등 다양한 OLED 소재를 양산하고 있으며, TFE 봉지 소재와 차세대 양자점(quantum dots) 소재도 개발 중이다. 2021년에는 LG Display의 파주(Paju) E3 라인에 HTL 소재 공급을 시작했으며, 같은 해 중국 장쑤성 창저우(Changzhou, Jiangsu)에 2,050만 달러 규모의 OLED 소재 공장 설립 계획도 발표한 바 있다. 업계에서는 Solus의 OLED 전략이 향후 호스트 소재 중심으로 집중될 것으로 보고 있다."],"image":"https://www.oled-info.com/sites/default/files/styles/large/public/2024-10/Solus-Advanced-Materials-OLED-fab-Iksan.jpg?itok=LdLAnEQ-","imageCaption":"","author":"","date":"2026-07-24T13:52:20+0300","time":"","url":"https://www.oled-info.com/solus-advanced-materials-reports-15-decrease-oled-material-sales-q2-2026","readTime":"3분","credibility":null,"isNew":true},{"id":"20","source":"OLED-Info","sourceName":"OLED-Info","sourceDate":"2026-07-24T13:47:14+0300","sourceUrl":"https://www.oled-info.com/finetek-supply-production-equipment-sdcs-vietnam-oled-module-line-companys","category":"디스플레이","tag":"산업 분석","title":"FINETEK, Samsung Display 베트남 OLED 라인에 역대 최대 수주","titleEn":"FINETEK to supply production equipment to SDC's Vietnam OLED module line, in the company's single largest order to date","deck":"한국 장비업체 FINETEK이 Samsung Display 베트남 OLED 모듈 라인에 195억 원 규모의 생산 장비를 공급한다. 창사 이래 최대 단일 수주다.","lede":"국내 디스플레이 장비 전문업체 FINETEK이 Samsung Display(SDC)의 베트남 OLED 모듈 생산 라인에 납품할 장비 공급 계약을 체결했다. 수주 금액은 195억 원(약 1,330만 달러)으로 FINETEK 역사상 최대 규모의 단일 수주다. 18년간 LGD·SDC 등 국내 주요 디스플레이 업체에 장비를 공급해온 FINETEK은 이번 계약을 계기로 디스플레이 부문 수주를 더욱 확대해 나갈 계획이다.","body":["=== 역대 최대 단일 수주 달성 ===","FINETEK은 Samsung Display(SDC)의 베트남 OLED 모듈 생산 라인에 공급할 장비 수주를 확보했다고 공식 발표했다. 계약 금액은 195억 원(약 1,330만 달러)으로, 이는 FINETEK 창사 이래 가장 큰 규모의 단일 수주다.","=== SDC 베트남 라인과의 협력 ===","이번 수주는 SDC가 베트남에 구축 중인 OLED 모듈 생산 라인을 위한 것이다. 구체적으로 어떤 종류의 장비가 발주됐는지는 공개되지 않았으나, FINETEK은 OLED 패널 로딩 장비, 세정 시스템, 본딩 장비, 검사 시스템 등 다양한 모듈 공정 장비를 보유하고 있다.","=== 18년 업력 기반의 성장 가속 ===","FINETEK은 지난 18년간 LGD와 SDC를 중심으로 국내 디스플레이 산업에 생산 장비를 공급해온 업체다. 이번 대형 수주를 발판 삼아 향후 디스플레이 관련 수주를 더욱 빠르게 늘려나갈 계획이라고 밝혔다."],"image":"https://www.oled-info.com/sites/default/files/inline-images/Fintek-OLED-equipment.jpg","imageCaption":"","author":"","date":"2026-07-24T13:47:14+0300","time":"","url":"https://www.oled-info.com/finetek-supply-production-equipment-sdcs-vietnam-oled-module-line-companys","readTime":"1분","credibility":null,"isNew":true},{"id":"21","source":"OLED-Info","sourceName":"OLED-Info","sourceDate":"2026-07-24T13:09:49+0300","sourceUrl":"https://www.oled-info.com/lg-display-plans-invest-2-billion-enhance-its-oled-laptop-and-tablet-production","category":"디스플레이","tag":"산업 분석","title":"LG Display, OLED 노트북·태블릿 경쟁력 강화에 3조 원 투자","titleEn":"LG Display plans to invest $2 billion to enhance its OLED laptop and tablet production capabilities","deck":"LG Display가 정부 저금리 대출과 자체 자본을 결합해 약 3조 원 규모의 OLED 생산 고도화 투자에 나선다. 중국 경쟁사를 견제하려는 한국 정부의 디스플레이 산업 육성 전략과도 맞닿아 있다.","lede":"LG Display가 약 3조 원(20억 달러) 규모의 신규 투자 계획을 추진 중인 것으로 알려졌다. 이번 투자는 생산 능력 확대보다는 기존 중소형 플렉서블 AMOLED 공정과 기술 고도화에 초점을 맞춘다. 한국 정부의 국가성장펀드 지원까지 등에 업은 LG Display는 노트북·태블릿용 IT OLED 패널의 성능을 끌어올려 중국 업체들과의 경쟁에서 우위를 점하겠다는 전략이다. 이번 투자는 최근 잇따른 OLED 투자 계획 중 세 번째에 해당한다.","body":["=== 투자 규모와 자금 구조 ===","LG Display는 총 3조 원(약 20억 달러) 규모의 신규 투자 계획을 수립한 것으로 전해진다. 자금 조달 구조를 보면, 한국 국가성장펀드로부터 1조 3,000억 원의 저금리 대출을 확보했고, 자체 자본 1조 5,000억 원과 민간 대출 2,000억 원도 더해진다. 한국 정부는 이번 지원을 통해 디스플레이 산업의 경쟁력을 강화하고 중국의 추격을 막겠다는 의도를 분명히 했다.","=== 기술 고도화 중심 전략 ===","이번 투자의 핵심은 생산 라인 증설이 아닌 기술 수준 자체를 끌어올리는 데 있다. LG Display가 도입할 기술로는 보다 진보된 LTPO 백플레인 공정, 탠덤 스택, 그리고 유리 기판 위에 박막 봉지(TFE on glass)를 적용하는 하이브리드 OLED 생산 방식 등이 포함된다. 새로운 모듈 제조 공정도 함께 도입될 예정이며, 궁극적인 목표는 노트북·태블릿용 IT OLED 패널의 성능 향상이다.","Paju 공장 일부 라인을 마스크리스(maskless) 공정인 ELEAP 방식으로 전환하는 작업도 이번 투자 계획의 일환일 수 있다는 관측도 나온다.","=== 최근 잇따른 OLED 투자 행보 ===","이번 투자는 LG Display의 세 번째 연속 OLED 투자 계획이다. 2025년에는 2년 기간으로 9억 2,500만 달러를 첨단 OLED 기술에 투자하는 계획을 발표했으며, 이 중 약 4억 1,000만 달러는 베트남 모듈 공장에 집중됐다. 당시 계획에는 LTPO·탠덤·COE 공정 업그레이드와 WOLED TV·모니터 기술 개선도 포함됐다.","2026년 4월에는 같은 해 4월부터 2028년 6월까지 7억 4,500만 달러를 OLED 생산 시설에 투자해 기술 경쟁력을 높이겠다는 계획도 별도로 공개한 바 있다.","=== 실적 개선과 Apple 공급망 지위 ===","불과 며칠 전 LG Display는 최근 분기 실적을 발표하며 OLED 사업의 성장세와 프리미엄 시장 집중 전략의 효과를 입증했다. 2026년 Apple은 최신 기기용 AMOLED 공급사로 Samsung과 함께 LG Display만을 선택했으며, 이는 LG Display의 고부가가치 전략이 실질적인 성과로 이어지고 있음을 보여준다."],"image":"https://www.oled-info.com/sites/default/files/styles/large/public/2024-08/LG-Guangzhou-LCD-fab-photo.jpg?itok=cS-pGy1V","imageCaption":"","author":"","date":"2026-07-24T13:09:49+0300","time":"","url":"https://www.oled-info.com/lg-display-plans-invest-2-billion-enhance-its-oled-laptop-and-tablet-production","readTime":"3분","credibility":null,"isNew":true},{"id":"22","source":"OLED-Info","sourceName":"OLED-Info","sourceDate":"2026-07-24T06:00:00+0300","sourceUrl":"https://www.oled-info.com/researchers-use-ai-and-machine-learning-design-two-new-promising-blue-tadf-oled","category":"디스플레이","tag":"산업 분석","title":"AI로 설계한 청색 TADF OLED 발광체, EQE 35.2% 달성","titleEn":"Researchers use AI and machine learning to design two new promising blue TADF OLED emitters","deck":"나고야대·규슈대 연구팀이 AI와 머신러닝으로 설계한 두 가지 청색 TADF OLED 발광체가 광발광 양자효율 100%에 근접하고 외부양자효율 35.2%를 기록했다.","lede":"일본 나고야대학과 규슈대학 공동 연구팀이 AI와 머신러닝을 활용해 새로운 OLED TADF 발광 분자 두 종을 설계·합성하는 데 성공했다. 연구팀은 1만 9,000개 이상의 가상 분자 라이브러리에서 출발해 최종 두 개의 후보 물질을 선별했으며, 실제 OLED 소자 테스트에서 주목할 만한 성능을 확인했다. 특히 한 물질은 차세대 디스플레이 표준인 Rec. 2020의 청색 원색에 근접했고, 다른 물질은 35.2%라는 높은 외부양자효율을 달성해 업계의 관심을 끌고 있다.","body":["=== AI 기반 분자 설계 프로세스 ===","나고야대학과 규슈대학 연구팀은 AI와 머신러닝을 적용해 '보론 프리(boron-free)' 13-링 골격 구조에 초점을 맞춘 새로운 OLED TADF 발광체 분자를 설계했다. 연구팀은 분자 구성 원소를 탄소·수소·질소로만 제한하고, 이를 조합해 1만 9,000개 이상의 가상 분자 라이브러리를 생성했다.","이 중 3D 모델링이 가능한 1만 7,000개의 분자를 대상으로 대규모 스크리닝을 실시해 유망 후보 50종을 추려냈다. 이후 고수준 양자 화학 계산을 거쳐 최종적으로 두 가지 분자를 합성 및 소자 테스트 대상으로 선정했다.","=== 두 발광체의 성능 ===","최종 선정된 두 분자 Cz-PAH-1과 Cz-PAH-2는 모두 좁은 대역폭의 청색 발광 특성과 함께 광발광 양자효율(PLQY) 100%에 근접하는 수치를 나타냈다.","Cz-PAH-1 기반 소자는 차세대 초고화질 디스플레이 표준인 Rec. 2020에서 정의하는 청색 원색에 근접한 색 좌표를 달성했다. Cz-PAH-2 기반 소자는 최대 외부양자효율(EQE) 35.2%라는 뛰어난 수치를 기록했다.","=== 업계 시사점 ===","이번 연구는 방대한 화학적 탐색 공간을 AI로 효율적으로 압축해 실용적인 OLED 발광체를 발굴할 수 있음을 보여준다. 보론을 사용하지 않는 접근법은 소재 비용 및 공정 안정성 측면에서도 긍정적인 가능성을 제시하며, 차세대 고색재현 디스플레이 개발에 기여할 것으로 전망된다."],"image":"https://www.oled-info.com/sites/default/files/inline-images/Nagoya-Kyushu-AI-Cz-PAH-1.jpg","imageCaption":"","author":"","date":"2026-07-24T06:00:00+0300","time":"","url":"https://www.oled-info.com/researchers-use-ai-and-machine-learning-design-two-new-promising-blue-tadf-oled","readTime":"2분","credibility":null,"isNew":true},{"id":"23","source":"DIGITIMES","sourceName":"DIGITIMES","sourceDate":"","sourceUrl":"https://www.digitimes.com/news/a20260721RS400/copos-glass-substrate-packaging-through-silicon-via-tsmc-2030.html","category":"테크","tag":"산업 분석","title":"TGV 기술 장벽 여전…CoPoS 상용화, 2030년 이후로 밀린다","titleEn":"TGV still faces technical barriers; CoPoS commercialization not likely until 2030","deck":"AI 칩 수요 급증으로 유리 기판 기반 첨단 패키징 경쟁이 가열되고 있다. 그러나 핵심 기술인 TGV(through-glass via)의 성숙도 부족으로 CoPoS 상용화는 2030년 이전엔 어렵다는 전망이다.","lede":"AI 칩 패키지 면적이 커지면서 기존 ABF 기판과 실리콘 인터포저를 유리 기판으로 대체하려는 움직임이 업계 전반으로 확산되고 있다. TSMC를 비롯해 Intel, Samsung, Rapidus 등 주요 파운드리들이 유리 기판 기반 첨단 패키징 기술 개발에 속도를 내고 있지만, 핵심 공정인 TGV 기술이 아직 미성숙 단계에 머물러 있다. 일본의 주요 기판 공급업체 Ibiden은 TGV 기술 장벽이 2030년이 돼야 돌파될 것으로 내다봤으며, 이에 따라 CoPoS(Chip on Package on Substrate)의 상용화 시점도 그 이후로 미뤄질 가능성이 높다. DIGITIMES 보고서는 TSMC의 CoPoS 기술 로드맵과 글로벌 파운드리들의 현황을 종합적으로 분석했다.","body":["=== 유리 기판이 주목받는 이유 ===","AI 칩의 컴퓨팅 성능 요구가 높아질수록 패키지 면적도 커지고 있다. 그 결과 12인치 웨이퍼 한 장에서 패키징할 수 있는 칩 수가 줄어들며 면적 낭비 문제가 심화되고 있다. 또한 ABF 같은 유기 기판 소재와 실리콘 웨이퍼 간 열팽창 계수 차이가 커 발생하는 휨(warpage) 현상도 점점 심각해지고 있다.","이 같은 문제를 해결할 대안으로 유리 기판이 부상했다. 유리는 열팽창 계수가 실리콘과 호환되고, 높은 평탄도, 낮은 신호 손실, 낮은 비용이라는 장점을 갖추고 있어 ABF 기판과 실리콘 인터포저를 대체할 최적의 소재로 평가받는다. 현재 OSAT(외주 반도체 패키징·테스트) 업체와 패널 제조사들은 FOPLP 기술을 앞다퉈 양산 중이지만, 유리 인터포저는 TGV 기술의 미성숙으로 아직 양산 단계에 진입하지 못했다.","=== TSMC CoPoS 로드맵 ===","TSMC의 CoPoS 양산 시점은 기술적 돌파구 마련 속도에 달려 있다. CoPoS의 핵심 병목인 TGV 기술 해결이 당초 예상보다 늦어지면서, TSMC는 당분간 기존 CoWoS 제품군의 수명 주기를 연장하는 전략을 택할 전망이다. DIGITIMES 분석에 따르면 TSMC는 2028년 유리 캐리어 기술을 양산에 도입할 것으로 예상된다.","TSMC의 애리조나(Arizona) 사이트는 미국 고객사 수요에 맞춰 운영되며, 장기적으로는 CoPoS에 초점을 맞출 것으로 알려졌다. 다만 CoPoS 병목 해소가 지연됨에 따라 CoWoS 기반 패키징 솔루션이 당분간 시장 주류를 유지할 것으로 보인다.","=== Intel·Samsung·Rapidus의 유리 기판 전략 ===","Intel은 글로벌 파운드리 중 유리 기판 첨단 패키징 샘플을 가장 먼저 선보인 곳이다. 그러나 양산 일정 측면에서는 이후 TSMC에 추월당한 상황이다. Intel의 sub-2nm 첨단 공정 및 첨단 패키징 확장 로드맵이 주목받고 있지만, 현재로선 TSMC 대비 상용화 속도에서 뒤처진 모습이다.","Samsung은 계열사들이 협력해 유리 기판 패키징 기술을 고도화하고 있으며, 소형 사이즈부터 단계적으로 적용을 시작할 계획이다. 일본의 Rapidus는 2nm 공정 개발과 대형 유리 기판 패키징을 동시에 추진하고 있지만, 단기적으로는 유리 기판을 캐리어 용도로만 활용하는 데 그칠 전망이다.","=== TGV 장벽과 상용화 전망 ===","TGV 기술은 유리 기판 기반 CoPoS 상용화의 최대 걸림돌로 꼽힌다. 일본의 선도적 기판 공급업체 Ibiden은 TGV 기술 장벽이 2030년경에야 돌파될 것으로 예상하고 있어, 유리 인터포저를 활용한 CoPoS 상용화도 그 이전에는 어렵다는 분석이 지배적이다.","PSMC를 포함한 글로벌 파운드리들이 유리 기판 기술 개발에 나서고 있지만, 기술 성숙도와 양산 적용 시점에는 업체마다 상당한 격차가 존재한다. 결론적으로 TGV 장벽은 여전히 높고, CoPoS 상용화는 2030년 이후로 밀릴 가능성이 크다. 한편 TSMC는 2028년 유리 캐리어 기술 양산 도입을 통해 이 전환기를 선도할 것으로 기대된다."],"image":"https://img.digitimes.com/newsshow/2026072100400_files/_2b","imageCaption":"","author":"","date":"","time":"","url":"https://www.digitimes.com/news/a20260721RS400/copos-glass-substrate-packaging-through-silicon-via-tsmc-2030.html","readTime":"3분","credibility":null,"isNew":true},{"id":"market_cap_dashboard","source":"krxviz","sourceName":"KRXVIZ","sourceDate":"7월 27일 · 월","sourceUrl":"https://krxviz.com/global","category":"시가총액","tag":"","title":"글로벌 시가총액","titleEn":"","deck":"주요 글로벌 기업 Top 30 · USD 기준","lede":"","body":["__MKTCAP__:[{\"symbol\": \"NVDA\", \"name\": \"NVIDIA\", \"exchange\": \"NASDAQ\", \"sector\": \"Technology\", \"currency\": \"USD\", \"price\": 206.84, \"chg_pct\": -0.55, \"mktcap\": 5009871551300.049}, {\"symbol\": \"AAPL\", \"name\": \"Apple\", \"exchange\": \"NASDAQ\", \"sector\": \"Technology\", \"currency\": \"USD\", \"price\": 333.02, \"chg_pct\": 3.71, \"mktcap\": 4891183133759.888}, {\"symbol\": \"GOOGL\", \"name\": \"Alphabet\", \"exchange\": \"NASDAQ\", \"sector\": \"Communication\", \"currency\": \"USD\", \"price\": 319.74, \"chg_pct\": 0.16, \"mktcap\": 3910399243430.9824}, {\"symbol\": \"MSFT\", \"name\": \"Microsoft\", \"exchange\": \"NASDAQ\", \"sector\": \"Technology\", \"currency\": \"USD\", \"price\": 381.7, \"chg_pct\": -0.19, \"mktcap\": 2835433617195.9346}, {\"symbol\": \"AMZN\", \"name\": \"Amazon\", \"exchange\": \"NASDAQ\", \"sector\": \"Consumer\", \"currency\": \"USD\", \"price\": 232.11, \"chg_pct\": -0.95, \"mktcap\": 2496832677755.5786}, {\"symbol\": \"TSM\", \"name\": \"TSMC\", \"exchange\": \"NYSE\", \"sector\": \"Technology\", \"currency\": \"USD\", \"price\": 403.41, \"chg_pct\": -2.77, \"mktcap\": 2092275500577.7651}, {\"symbol\": \"AVGO\", \"name\": \"Broadcom\", \"exchange\": \"NASDAQ\", \"sector\": \"Technology\", \"currency\": \"USD\", \"price\": 381.9
