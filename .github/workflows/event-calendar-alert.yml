name: IR 새소식 알림

on:
  schedule:
    # 3시간마다 확인 (UTC 기준)
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: event-calendar-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 curl_cffi

      - name: Check IR sites
        id: check
        run: python scripts/check_ir_updates.py

      - name: Commit updated state
        if: always() && steps.check.outputs.state_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "상태 변경 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "chore: update IR monitor state [skip ci]"
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            git pull --rebase
            sleep 5
          done
          git push

      - name: Create alert issue
        if: always() && steps.check.outputs.notify == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ steps.check.outputs.title }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "$ISSUE_TITLE" \
            --body-file notification.md \
            --assignee "${{ github.repository_owner }}"
