name: Apple 뉴스 사이트 갱신

on:
  schedule:
    # 3시간마다 갱신 (UTC 기준)
    - cron: '30 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apple-news-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Build Apple news site
        id: build
        run: python scripts/build_apple_news.py

      - name: Commit updated site
        if: steps.build.outputs.state_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/apple_news.json site/
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "chore: update Apple news site [skip ci]"
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            git pull --rebase
            sleep 5
          done
          git push
